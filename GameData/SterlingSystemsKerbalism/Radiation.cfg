//
// Nuclear Reactors
//

@PART[strl-rctrms*]:NEEDS[FeatureRadiation,SterlingSystems]:FOR[SterlingSystemsKerbalism]
{
	MODULE
	{
		name = Emitter
		radiation = #$/mass$
		@radiation != 0.85
		@radiation *= 2.77778E-05
	}
}

@PART[strl-rctrpb*]:NEEDS[FeatureRadiation,SterlingSystems]:FOR[SterlingSystemsKerbalism]
{
	MODULE
	{
		name = Emitter
		radiation = #$/mass$
		@radiation != 0.8
		@radiation *= 2.77778E-05
	}
}

// RTG
@PART[strl-rctrscm]:NEEDS[ProfileDefault]:AFTER[KerbalismDefault]
{
	MODULE
	{
		name = ProcessController
		resource = _RTG
		title = #KERBALISM_RTG_title //RTG
		capacity = 27
		running = true
		toggle = false
	}
}

// BVG
@PART[strl-rctrbv??]:NEEDS[ProfileDefault]:FOR[SterlingSystemsKerbalism]
{
	!MODULE[ModuleGenerator] {}
	MODULE
	{
		name = ProcessController
		resource = _BVG
		title = BVG
		capacity = 0.125
		running = true
		toggle = false
	}
}
@PART[strl-rctrbv02]:NEEDS[ProfileDefault]:FOR[SterlingSystemsKerbalism]
{
	@MODULE[ProcessController]:HAS[#resource[?BVG]]
	{
		@capacity = 0.375
	}
}
@PART[strl-rctrbv03]:NEEDS[ProfileDefault]:FOR[SterlingSystemsKerbalism]
{
	@MODULE[ProcessController]:HAS[#resource[?BVG]]
	{
		@capacity = 0.75
	}
}
@PART[strl-rctrbv04]:NEEDS[ProfileDefault]:FOR[SterlingSystemsKerbalism]
{
	@MODULE[ProcessController]:HAS[#resource[?BVG]]
	{
		@capacity = 1.5
	}
}


