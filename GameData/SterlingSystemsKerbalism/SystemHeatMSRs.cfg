@PART[strl-rctrms-*]:NEEDS[Kerbalism,SystemHeat]:FOR[SterlingSystemsKerbalism]
{
	@tags ^= :$: _kerbalism
	flowBrd = 0.0000988946
	flowNuc = 0.00000988946
	flowPwr = 129.935
	flowWH = 65
	@flowBrd *= #$refPower$
	@flowNuc *= #$refPower$
	@flowPwr *= #$refPower$
	@flowWH *= #$refPower$
	
	flowBrdHr = #$flowBrd$
	flowNucHr = #$flowNuc$
	@flowBrdHr *= 3600
	@flowNucHr *= 3600
	
	@flowBrdHr += 0.005
	@flowBrdHr *= 100
	@flowBrdHr = #$flowBrdHr[0,.]$ // regex truncate, unknown behavior but used in RO
	@flowBrdHr /= 100
	
	@flowNucHr += 0.005
	@flowNucHr *= 100
	@flowNucHr = #$flowNucHr[0,.]$ // regex truncate, unknown behavior but used in RO
	@flowNucHr /= 100
	
	!MODULE[ModuleSystemHeatConverter],* {}
	!MODULE[ModuleResourceConverter],* {}
	!MODULE[ModuleOverheatDisplay] {}
	!MODULE[ModuleCoreHeat] {}
}
@PART[strl-rctrms-*]:NEEDS[Kerbalism,SystemHeat]:FOR[SterlingSystemsKerbalism]
{
	// = = Kerbalism = =
	MODULE
	{
		name = SystemHeatConverterKerbalism
		ConverterName = #LOC_strl_reactor_fission
		StartActionName = #LOC_strl_reactor_start
		StopActionName = #LOC_strl_reactor_stop
		ToggleActionName = #LOC_strl_reactor_toggle
		FillAmount = 1
		AutoShutdown = true
		GeneratesHeat = false
		UseSpecialistBonus = false
		moduleID = MoltenSaltReactor
		systemHeatModuleID = nuke
		shutdownTemperature = 1300
		systemOutletTemperature = 1100
		systemPower = #$/flowWH$
		systemEfficiency
		{
			key = 0 1
			key = 1 1
		}
		INPUT_RESOURCE
		{
			ResourceName = FissileFuel
			Ratio = #$/flowNuc$
			FlowMode = STAGE_PRIORITY_FLOW
		}
		OUTPUT_RESOURCE
		{
			ResourceName = FizzledFuel
			Ratio = #$/flowNuc$
			DumpExcess = false
			FlowMode = ALL_VESSEL
		}
		OUTPUT_RESOURCE
		{
			ResourceName = ThermalPower
			Ratio = #$/flowPwr$
			DumpExcess = false
			FlowMode = ALL_VESSEL
		}			
	}
	MODULE:NEEDS[CommunityResourcePack]
	{
		name = SystemHeatConverterKerbalism
		ConverterName = Tritium Breeder MSR
		StartActionName = Start Tritium Breeder MSR
		StopActionName = Stop Tritium Breeder MSR
		ToggleActionName = Toggle Tritium Breeder MSR
		FillAmount = 1
		AutoShutdown = true
		GeneratesHeat = false
		UseSpecialistBonus = true
		moduleID = TritiumBreederMSR
		systemHeatModuleID = nuke
		shutdownTemperature = 1300
		systemOutletTemperature = 1100
		systemPower = #$/flowWH$
		systemEfficiency
		{
			key = 0 1
			key = 1 1
		}
		INPUT_RESOURCE
		{
			ResourceName = FissileFuel
			Ratio = #$/flowNuc$
			FlowMode = STAGE_PRIORITY_FLOW
		}
		INPUT_RESOURCE
		{
			ResourceName = Lithium
			Ratio = #$/flowBrd$
			FlowMode = STAGE_PRIORITY_FLOW
		}		
		OUTPUT_RESOURCE
		{
			ResourceName = FizzledFuel
			Ratio = #$/flowNuc$
			DumpExcess = false
			FlowMode = ALL_VESSEL
		}
		OUTPUT_RESOURCE
		{
			ResourceName = LqdTritium
			Ratio = #$/flowBrd$
			DumpExcess = false
			FlowMode = ALL_VESSEL
		}		
		OUTPUT_RESOURCE
		{
			ResourceName = ThermalPower
			Ratio = #$/flowPwr$
			DumpExcess = false
			FlowMode = ALL_VESSEL
		}			
	}
	
	MODULE
	{
		name = Configure
		title = Sterling Molten Salt Reactor
		slots = 1
		reconfigure = engineer@5
		SETUP
		{
			name = MSR
			desc = #The standard nuclear salt reaction. \n\n<b>Consumes</b>: \n- $/flowNucHr$ FiF / hr \n\n<b>Produces</b> \n- $/flowPwr$ ThP / sec
			MODULE
			{
				type = SystemHeatConverterKerbalism
				id_field = moduleID
				id_value = MoltenSaltReactor
			}
		}
		SETUP:NEEDS[CommunityResourcePack]
		{
			name = Breeder MSR
			desc = #The standard nuclear salt reaction with a molten Lithium curtain flowing adjacent to it. \n\n<b>Consumes</b>: \n- $/flowNucHr$ FiF / hr \n- $/flowBrdHr$ Li / hr \n\n<b>Produces</b> \n- $/flowPwr$ ThP / sec \n- $/flowBrdHr$ T / hr
			MODULE
			{
				type = SystemHeatConverterKerbalism
				id_field = moduleID
				id_value = TritiumBreederMSR
			}
		}
	}
	
	MODULE:NEEDS[FeatureReliability]
	{
		name = Reliability
		type = SystemHeatConverterKerbalism
		title = Molten Salt Reactor
		repair = Engineer
		mtbf = 72576000
		extra_cost = 1.0
		extra_mass = 0.2
	}	
}