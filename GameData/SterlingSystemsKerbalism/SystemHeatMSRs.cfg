@PART[strl-rctrms-*]:NEEDS[Kerbalism,SystemHeat]:FOR[SterlingSystemsKerbalism]
{
	@tags ^= :$: _kerbalism

	!MODULE[ModuleSystemHeatConverter],* {}
	!MODULE[ModuleResourceConverter],* {}
	!MODULE[ModuleOverheatDisplay] {}
	!MODULE[ModuleCoreHeat] {}

	// = = Kerbalism = =
	MODULE
	{
		name = SystemHeatConverterKerbalism
		ConverterName = #LOC_strl_reactor_fission
		StartActionName = #LOC_strl_reactor_start
		StopActionName = #LOC_strl_reactor_stop
		ToggleActionName = #LOC_strl_reactor_toggle
		FillAmount = 1
		AutoShutdown = true
		GeneratesHeat = false
		UseSpecialistBonus = false
		moduleID = MoltenSaltReactor
		systemHeatModuleID = nuke
		shutdownTemperature = 1300
		systemOutletTemperature = 1100
		systemPower = 65
		@systemPower *= #$/refPower$
		systemEfficiency
		{
			key = 0 1
			key = 1 1
		}
		INPUT_RESOURCE
		{
			ResourceName = FissileFuel
			Ratio = 0.00000988946
			@Ratio *= #$/refPower$
			FlowMode = STAGE_PRIORITY_FLOW
		}
		OUTPUT_RESOURCE
		{
			ResourceName = FizzledFuel
			Ratio = 0.00000988946
			@Ratio *= #$/refPower$
			DumpExcess = false
			FlowMode = ALL_VESSEL
		}
		OUTPUT_RESOURCE
		{
			ResourceName = ThermalPower
			Ratio = 129.935 // 130 //  99.95% net energy
			@Ratio *= #$/refPower$
			DumpExcess = false
			FlowMode = ALL_VESSEL
		}			
	}
	MODULE:NEEDS[CommunityResourcePack]
	{
		name = SystemHeatConverterKerbalism
		ConverterName = Tritium Breeder MSR
		StartActionName = Start Tritium Breeder MSR
		StopActionName = Stop Tritium Breeder MSR
		ToggleActionName = Toggle Tritium Breeder MSR
		FillAmount = 1
		AutoShutdown = true
		GeneratesHeat = false
		UseSpecialistBonus = true
		moduleID = TritiumBreederMSR
		systemHeatModuleID = nuke
		shutdownTemperature = 1300
		systemOutletTemperature = 1100
		systemPower = 65
		@systemPower *= #$/refPower$
		systemEfficiency
		{
			key = 0 1
			key = 1 1
		}
		INPUT_RESOURCE
		{
			ResourceName = FissileFuel
			Ratio = 0.00000988946
			@Ratio *= #$/refPower$
			FlowMode = STAGE_PRIORITY_FLOW
		}
		INPUT_RESOURCE
		{
			ResourceName = Lithium
			Ratio = 0.0000988946
			@Ratio *= #$/refPower$
			FlowMode = STAGE_PRIORITY_FLOW
		}		
		OUTPUT_RESOURCE
		{
			ResourceName = FizzledFuel
			Ratio = 0.00000988946
			@Ratio *= #$/refPower$
			DumpExcess = false
			FlowMode = ALL_VESSEL
		}
		OUTPUT_RESOURCE
		{
			ResourceName = LqdTritium
			Ratio = 0.0000988946
			@Ratio *= #$/refPower$
			DumpExcess = false
			FlowMode = ALL_VESSEL
		}		
		OUTPUT_RESOURCE
		{
			ResourceName = ThermalPower
			Ratio = 129.935 // 130 //  99.95% net energy
			@Ratio *= #$/refPower$
			DumpExcess = false
			FlowMode = ALL_VESSEL
		}			
	}
	
	MODULE
	{
		name = Configure
		title = Sterling Molten Salt Reactor
		slots = 1
		reconfigure = engineer@5
		SETUP
		{
			name = MSR
			desc = hot hot red tub
			MODULE
			{
				type = SystemHeatConverterKerbalism
				id_field = moduleID
				id_value = MoltenSaltReactor
			}
		}
		SETUP:NEEDS[CommunityResourcePack]
		{
			name = Breeder MSR
			desc = hot hot red tub with tritium
			MODULE
			{
				type = SystemHeatConverterKerbalism
				id_field = moduleID
				id_value = TritiumBreederMSR
			}
		}
	}
	
	MODULE:NEEDS[FeatureReliability]
	{
		name = Reliability
		type = SystemHeatConverterKerbalism
		title = Molten Satl Reactor
		repair = Engineer
		mtbf = 72576000
		extra_cost = 1.0
		extra_mass = 0.2
	}	
}