Profile
{
	name = KerbalismSupport
	modname = Sterling Systems Kerbalism
	moddir = SterlingSystemsKerbalism
	
	Supply
	{
		resource = FissileFuel
		low_message = FissileFuel is almost depleted on $VESSEL@<i>Fission reactions will soon be unavailable</i>
		empty_message = There is no more FissileFuel on $VESSEL@<i>Fission reactions are no longer available</i>
		refill_message = $VESSEL FissileFuel storage refilled@<i>Fission reactions are available once again</i>
	}
	Supply
	{
		resource = Fission Pebbles
		low_message = Fission Pebbles are almost depleted on $VESSEL@<i>Fission reactions will soon be unavailable</i>
		empty_message = There is no more Fission Pebbles on $VESSEL@<i>Fission reactions are no longer available</i>
		refill_message = $VESSEL Fission Pebbles storage refilled@<i>Fission reactions are available once again</i>
	}
