	}

	Process
	{
		name = FissileFuel(Easy)
		title = Fissile Fuel (Easy)
		Tag = SS
		modifier = _FFE
		input = ElectricCharge@30.0
		input = Uraninite@0.04
		input = Carbon@0.00572
		input = ExoticMinerals@0.06
		input = RareMetals@0.00293
		output = FissileFuel@0.27
		output = LqdCO2@0.003751
		dump_valve = FissileFuel,LqdCO2,FissileFuel&LqdCO2
	}
	Process
	{
		name = FissileFuel(Hard)
		title = Fissile Fuel (Hard)
		Tag = SS
		modifier = _FFH
		input = ElectricCharge@30.0
		input = Uraninite@0.04
		input = Lithium@0.03
		input = LqdFluorine@0.005
		input = Beryllium@0.01
		input = Carbon@0.00572
		output = FissileFuel@0.27
		output = LqdCO2@0.003751
		dump_valve = FissileFuel,LqdCO2,FissileFuel&LqdCO2
	}	
	Process
	{
		name = RefreshFizzledFuel
		title = Refresh Fizzled Fuel
		tag = SS
		modifier = _RFF
		input = ElectricCharge@30.0
		input = Uraninite@0.036
		input = FizzledFuel@0.15
		input = Carbon@0.00572
		output = FissileFuel@0.15
		output = LqdCO2@0.003751
		output = Slag@0.05
		dump_valve = FissileFuel,LqdCO2,Slag,FissileFuel&LqdCO2,LqdCO2&Slag,FissileFuel&Slag
	}
	Process
	{
		name = FissilePebbles
		title = Fissile Pebbles
		tag = SS 
		modifier = _FP
		input = ElectricCharge@30.0
		input = Uraninite@0.036
		input = Silicon@0.01
		input = Carbon@0.01
		output = FissilePebbles@0.09
		output = LqdCO2@0.003751
		dump_valve = FissilePebbles,LqdCO2,FissilePebbles&LqdCO2
	}
	Process
	{
		name = UraniumRefiner
		title = Uranium Refiner
		tag = SS
		modifier = _UR
		input = ElectricCharge@18.0
		input = Uraninite@0.0015
		output = EnrichedUranium@0.001
	}
	Process
	{
		name = FFTOrionPulse
		title = FFT Orion Pulse Crafting
		Tag = SS
		modifier = _FFTOrionPulse
		input = ElectricCharge@0.0042
		input = Metals@0.0002 // 50% efficient
		input = RareMetals@0.00056 // 50% efficient
		input = Uraninite@0.00028
		output = FissionPulses@0.1
		output = Oxygen@0.13548
		dump_valve = Oxygen
	}
	Process
	{
		name = UraniumSalter
		title = Uranium Salter
		tag = SS
		modifier = _US
		input = EnrichedUranium@0.0002
		input = Water@1.0
		input = ElectricCharge@18.0
		output = NuclearSaltWater@1.0
	}
	Process
	{
		name = RecycleDepletedUranium
		title = Recycle Depleted Uranium
		tag = SS
		modifier = _RDUU
		input = DepletedFuel@0.001
		input = ElectricCharge@18.0
		output = EnrichedUranium@0.0005
		output = XenonGas@0.001
		dump_valve = EnrichedUranium,XenonGas,EnrichedUranium&XenonGas
	}
	
