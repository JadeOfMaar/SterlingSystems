// = = = Fuel cells = = = 

@PART[strl-fuelcell-*]:NEEDS[CommunityResourcePack,B9PartSwitch,SystemHeatConverters,zKerbalismSystemHeat]
{
	@MODULE[ModuleB9PartSwitch]:HAS[#moduleID[fuelSwitch]]
	{
		@SUBTYPE,*
		{
			@MODULE,1
			{
				@IDENTIFIER
				{
					@name = SystemHeatConverterKerbalism
				}
			}
		}
	}
}

// = = = Preheaters = = = 

@PART[strl-preh-*]:NEEDS[CommunityResourcePack,B9PartSwitch,SystemHeat,zKerbalismSystemHeat]
{
	@MODULE[ModuleB9PartSwitch]:HAS[#moduleID[shutdownTemperature]]
	{
		@SUBTYPE,*
		{
			@MODULE
			{
				@IDENTIFIER
				{
					@name = SystemHeatConverterKerbalism
				}
			}
		}
	}
}
