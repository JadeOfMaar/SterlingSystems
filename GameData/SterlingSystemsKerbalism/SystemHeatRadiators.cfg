// = = = Thermals = = = 


@PART[strl-rad-sink-*]:NEEDS[SterlingSystems/Thermals]:BEFORE[zKerbalismSystemHeat]
{
	@MODULE[ModuleSystemHeatRadiator]
	{
		@name = SystemHeatRadiatorKerbalism
	}
}

@PART[strl-rad-wrap?-*]:NEEDS[SterlingSystems/Thermals]:BEFORE[zKerbalismSystemHeat]
{
	@MODULE[ModuleSystemHeatRadiator]
	{
		@name = SystemHeatRadiatorKerbalism
	}
	@MODULE[ModuleB9PartSwitch]:HAS[#moduleID[Height]]
	{
		@SUBTYPE,*
		{
			@MODULE:HAS[@IDENTIFIER[ModuleSystemHeatRadiator]]
			{
				@IDENTIFIER
				{
					@name = SystemHeatRadiatorKerbalism
				}
			}
		}
	}
}

