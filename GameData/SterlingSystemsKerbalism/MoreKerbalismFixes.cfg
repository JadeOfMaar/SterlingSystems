//Cleanup
@PART[strl-worldpower-sth*]:AFTER[KerbalismDefault]:NEEDS[SterlingSystems/WorldPower]
{
    !MODULE[Reliability]:HAS[#type[SolarPanelFixer]],* {}
    !MODULE[SolarPanelFixer],* {}
	MODULE
	{
		name = PlannerController
		title = Solar Thermal Panel
		considered = true
	}
	+MODULE[ModuleDeployableSolarPanel],*
	{
		-* = delete
		-powerCurve {}
		-temperatureEfficCurve {}
		-timeEfficCurve {}
		-UPGRADES {}
		@name = ThermalPanelFixer
	}
}

@PART[strl-worldpower-sth*]:NEEDS[Kerbalism,FeatureReliability]
{
	MODULE
	{
		name = Reliability
		type = ThermalPanelFixer
		title = Solar Thermal Panel
		redundancy = Power Generation
		repair = Engineer@2
		mtbf = 145152000
		extra_cost = 1.5
		extra_mass = 0.5
	}
}
