// Sterling Metal Fuel Cell
@PART[strl-fuelcell-*]:NEEDS[CommunityResourcePack,Kerbalism,SterlingSystems]:FOR[SterlingSystemsKerbalism]
{
	@tags ^= :$: _kerbalism	
	!MODULE[ModuleResourceConverter],* {}
	!MODULE[ModuleOverheatDisplay] {}
	!MODULE[ModuleCoreHeat] {}
	// = = Kerbalism = =
	
	@MODULE[ModuleB9PartSwitch]:HAS[#moduleID[fuelSwitch]]
	{
		@SUBTYPE,*
		{
			!descriptionSummary = nope
			!descriptionDetail = nope
			!MODULE,* {}
		}
	}
	
	MODULE
	{
		name = SystemHeatConverterKerbalism
		ConverterName = Aluminium Fuel Cell
		StartActionName = Start Aluminium Fuel Cell
		StopActionName = Stop Aluminium Fuel Cell
		ToggleActionName = Toggle Aluminium Fuel Cell
		FillAmount = 0.95
		AutoShutdown = true
		GeneratesHeat = false
		UseSpecialistBonus = false
		moduleID = AluminiumFuelCell
		systemHeatModuleID = isru
		shutdownTemperature = 1300
		systemOutletTemperature = 1000
		systemPower = 0
		systemEfficiency
		{
			key = 0 1
			key = 1 1
		}
		INPUT_RESOURCE
		{
			ResourceName = Aluminium
			Ratio = 0.3610
			@Ratio *= #$/refPower$
			FlowMode = STAGE_PRIORITY_FLOW
		}
		INPUT_RESOURCE
		{
			ResourceName = LqdOxygen
			Ratio = 0.3828
			@Ratio *= #$/refPower$			
			FlowMode = STAGE_PRIORITY_FLOW
		}
		OUTPUT_RESOURCE
		{
			ResourceName = Alumina
			Ratio = 0.3610
			@Ratio *= #$/refPower$			
		}
		OUTPUT_RESOURCE
		{
			ResourceName = ThermalPower
			Ratio = 8
			@Ratio *= #$/refPower$			
			DumpExcess = True
		}
		OUTPUT_RESOURCE
		{
			ResourceName = ElectricCharge
			Ratio = 16000
			@Ratio *= #$/refPower$			
		}
	}
	MODULE
	{
		name = SystemHeatConverterKerbalism
		ConverterName = Silicon Fuel Cell
		StartActionName = Start Silicon Fuel Cell
		StopActionName = Stop Silicon Fuel Cell
		ToggleActionName = Toggle Silicon Fuel Cell
		FillAmount = 0.95
		AutoShutdown = true
		GeneratesHeat = false
		UseSpecialistBonus = false
		moduleID = SiliconFuelCell
		systemHeatModuleID = isru
		shutdownTemperature = 1300
		systemOutletTemperature = 1000
		systemPower = 0
		systemEfficiency
		{
			key = 0 1
			key = 1 1
		}
		INPUT_RESOURCE
		{
			ResourceName = Silicon
			Ratio = 0.4293
			@Ratio *= #$/refPower$				
			FlowMode = STAGE_PRIORITY_FLOW
		}
		INPUT_RESOURCE
		{
			ResourceName = LqdOxygen
			Ratio = 0.4293
			@Ratio *= #$/refPower$			
			FlowMode = STAGE_PRIORITY_FLOW
		}
		OUTPUT_RESOURCE
		{
			ResourceName = LqdQuartz
			Ratio = 0.8555
			@Ratio *= #$/refPower$			
		}
		OUTPUT_RESOURCE
		{
			ResourceName = ThermalPower
			Ratio = 7.5
			@Ratio *= #$/refPower$			
			DumpExcess = True
		}
		OUTPUT_RESOURCE
		{
			ResourceName = ElectricCharge
			Ratio = 15000
			@Ratio *= #$/refPower$			
		}	
	}
	MODULE
	{
		name = SystemHeatConverterKerbalism
		ConverterName = Beryllium Fuel Cell
		StartActionName = Start Beryllium Fuel Cell
		StopActionName = Stop Beryllium Fuel Cell
		ToggleActionName = Toggle Beryllium Fuel Cell
		FillAmount = 0.95
		AutoShutdown = true
		GeneratesHeat = false
		UseSpecialistBonus = false
		moduleID = BerylliumFuelCell
		systemHeatModuleID = isru
		shutdownTemperature = 1300
		systemOutletTemperature = 1000
		systemPower = 0
		systemEfficiency
		{
			key = 0 1
			key = 1 1
		}
		INPUT_RESOURCE
		{
			ResourceName = Beryllium
			Ratio = 1.3319
			@Ratio *= #$/refPower$	
			FlowMode = STAGE_PRIORITY_FLOW
		}
		INPUT_RESOURCE
		{
			ResourceName = LqdOxygen
			Ratio = 1.9978
			@Ratio *= #$/refPower$		
			FlowMode = STAGE_PRIORITY_FLOW
		}
		OUTPUT_RESOURCE
		{
			ResourceName = BerylOxide
			Ratio = 1.3319
			@Ratio *= #$/refPower$
		}
		OUTPUT_RESOURCE
		{
			ResourceName = ThermalPower
			Ratio = 12
			@Ratio *= #$/refPower$		
			DumpExcess = True
		}
		OUTPUT_RESOURCE
		{
			ResourceName = ElectricCharge
			Ratio = 24000
			@Ratio *= #$/refPower$			
		}
	}
	
	MODULE
	{
		name = Configure
		title = Sterling Metal Fuel Cell
		slots = 1
		reconfigure = engineer@3		
		SETUP
		{
			name = Aluminium Fuel Cell
			desc = #$@STRLB9LOC/txtFCMain$$@STRLB9LOC/txtInputs$ $/RatioAl$ Al/s + $/RatioO2Al$ LOX/s.<br>$@STRLB9LOC/txtOutputs$ $/RatioECAl$ EC/s + $/RatioTPAl$ TP/s.
			tech = advScienceTech
			MODULE
			{
				type = SystemHeatConverterKerbalism
				id_field = moduleID
				id_value = AluminiumFuelCell
			}
		}
		SETUP
		{
			name = Silicon Fuel Cell
			desc = #$@STRLB9LOC/txtFCMain$$@STRLB9LOC/txtInputs$ $/RatioSi$ Si/s + $/RatioO2Si$ LOX/s.<br>$@STRLB9LOC/txtOutputs$ $/RatioECSi$ EC/s + $/RatioTPSi$ TP/s.
			tech = advScienceTech
			MODULE
			{
				type = SystemHeatConverterKerbalism
				id_field = moduleID
				id_value = SiliconFuelCell
			}
		}
		SETUP
		{
			name = Beryllium Fuel Cell
			desc = #$@STRLB9LOC/txtFCMain$$@STRLB9LOC/txtInputs$ $/RatioBe$ Be/s + $/RatioO2Be$ LOX/s.<br>$@STRLB9LOC/txtOutputs$ $/RatioECBe$ EC/s + $/RatioTPBe$ TP/s.
			tech = advScienceTech
			MODULE
			{
				type = SystemHeatConverterKerbalism
				id_field = moduleID
				id_value = BerylliumFuelCell
			}
		}
	}
	
	MODULE:NEEDS[FeatureReliability]
	{
		name = Reliability
		type = ProcessController
		title = Metal Fuel Cell
		repair = Engineer
		mtbf = 72576000
		extra_cost = 1.0
		extra_mass = 0.2
	}
}

