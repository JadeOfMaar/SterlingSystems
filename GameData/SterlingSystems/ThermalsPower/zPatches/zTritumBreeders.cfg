// = = = Fission Reactors = = =

@PART[strl-rctrms-*]
{
	+MODULE[ModuleResourceConverter],0:NEEDS[!SystemHeat]
	{
		@ConverterName = Tritium Breeder
		@StartActionName = Start Tritium Breeder
		@StopActionName = Stop Tritium Breeder
		@ToggleActionName = Toggle Tritium Breeder
		INPUT_RESOURCE
		{
			ResourceName = Lithium
			Ratio = 0.00000988946
			@Ratio *= #$/refPower$
			FlowMode = STAGE_PRIORITY_FLOW
		}
		OUTPUT_RESOURCE
		{
			ResourceName = LqdTritium
			Ratio = 0.00000988946
			@Ratio *= #$/refPower$
			DumpExcess = false
			FlowMode = ALL_VESSEL
		}
	}
	+MODULE[ModuleSystemHeatConverter],0:NEEDS[SystemHeat]
	{
		@moduleID = TritiumBreeder
		@ConverterName = Tritium Breeder
		@StartActionName = Start Tritium Breeder
		@StopActionName = Stop Tritium Breeder
		@ToggleActionName = Toggle Tritium Breeder
		INPUT_RESOURCE
		{
			ResourceName = Lithium
			Ratio = 0.00000988946
			@Ratio *= #$/refPower$
			FlowMode = STAGE_PRIORITY_FLOW
		}
		OUTPUT_RESOURCE
		{
			ResourceName = LqdTritium
			Ratio = 0.00000988946
			@Ratio *= #$/refPower$
			DumpExcess = false
			FlowMode = ALL_VESSEL
		}
	}
}


// = = = Tankage = = =


@PART[strl-tankdrumb-*]:NEEDS[SterlingSystems/Tankage]
{
	decayTime = 220838400 // 24 yr @ 6 hr/dd
	
	// Decay rate depends on tank volume
	decayRateA = #$refVolume$
	decayRateB = #$refVolume$
	decayRateC = #$refVolume$
	decayRateD = #$refVolume$
	
	// get added volumes for the higher rates
	@decayRateB += #$MODULE[ModuleB9PartSwitch],1/SUBTYPE,1/volumeAddedToParent$
	@decayRateC += #$MODULE[ModuleB9PartSwitch],1/SUBTYPE,2/volumeAddedToParent$
	@decayRateD += #$MODULE[ModuleB9PartSwitch],1/SUBTYPE,3/volumeAddedToParent$
	
	// get the per second values for resource throughput
	@decayRateA /= #$decayTime$
	@decayRateB /= #$decayTime$
	@decayRateC /= #$decayTime$
	@decayRateD /= #$decayTime$
	
	// get the per day values for resource throughput
	decayPerDayA = #$decayRateA$
	decayPerDayB = #$decayRateB$
	decayPerDayC = #$decayRateC$
	decayPerDayD = #$decayRateD$
	
	@decayPerDayA *= 21600
	@decayPerDayB *= 21600
	@decayPerDayC *= 21600
	@decayPerDayD *= 21600
	
	// clip trailing digits
	@decayPerDayA *= 100
	@decayPerDayA = #$decayPerDayA[0,.]$ // regex drop trailing characters
	@decayPerDayA /= 100
	
	@decayPerDayB *= 100
	@decayPerDayB = #$decayPerDayB[0,.]$
	@decayPerDayB /= 100
	
	@decayPerDayC *= 100
	@decayPerDayC = #$decayPerDayC[0,.]$
	@decayPerDayC /= 100
	
	@decayPerDayD *= 100
	@decayPerDayD = #$decayPerDayD[0,.]$
	@decayPerDayD /= 100
	
	// Heat generation depends on volume
	decayPowerA = #$refVolume$
	decayPowerB = #$refVolume$
	decayPowerC = #$refVolume$
	decayPowerD = #$refVolume$
	
	// get added volumes for the higher rates
	@decayPowerB += #$MODULE[ModuleB9PartSwitch],1/SUBTYPE,1/volumeAddedToParent$
	@decayPowerC += #$MODULE[ModuleB9PartSwitch],1/SUBTYPE,2/volumeAddedToParent$
	@decayPowerD += #$MODULE[ModuleB9PartSwitch],1/SUBTYPE,3/volumeAddedToParent$
	
	// scale back these values for heat energy
	@decayPowerA /= 20000
	@decayPowerB /= 20000
	@decayPowerC /= 20000
	@decayPowerD /= 20000
	
	MODULE
	{
		name = ModuleGenerator
		isAlwaysActive = true
		requiresAllInputs = true
		INPUT_RESOURCE
		{
			name = LqdTritium
			rate = #$/decayRateA$
			FlowMode = NO_FLOW
		}
		OUTPUT_RESOURCE
		{
			name = LqdHe3
			rate = #$/decayRateA$
		}
		OUTPUT_RESOURCE
		{
			name = ThermalPower
			rate = #$/decayPowerA$
		}
	}
	@MODULE[ModuleB9PartSwitch],0
	{
		SUBTYPE
		{
			name = Tritium
			title = LqdTritium
			// primaryColor = BoringGreen
			// secondaryColor = BoringGreen
			RESOURCE
			{
				name = LqdTritium
				unitsPerVolume = 5
			}
		}
	}
	
	@MODULE[ModuleB9PartSwitch],1
	{
		@SUBTYPE,0
		{
			descriptionSummary = #<b>Breeder tank:</b><br>- Loses $/decayPerDayA$ T/dy <br>- Gains $/decayPerDayA$ 3He/dy <br>- Gains $/decayPowerA$ ThP/s
		}
		@SUBTYPE,1
		{
			descriptionSummary = #<b>Breeder tank:</b><br>- Loses $/decayPerDayB$ T/dy <br>- Gains $/decayPerDayB$ 3He/dy <br>- Gains $/decayPowerB$ ThP/s
			MODULE
			{
				IDENTIFIER
				{
					name = ModuleGenerator
				}
				DATA
				{
					INPUT_RESOURCE
					{
						name = LqdTritium
						rate = #$/decayRateB$
						FlowMode = NO_FLOW
					}
					OUTPUT_RESOURCE
					{
						name = LqdHe3
						rate = #$/decayRateB$
					}
					OUTPUT_RESOURCE
					{
						name = ThermalPower
						rate = #$/decayPowerB$
					}
				}
			}
		}
		@SUBTYPE,2
		{
			descriptionSummary = #<b>Breeder tank:</b><br>- Loses $/decayPerDayC$ T/dy <br>- Gains $/decayPerDayC$ 3He/dy <br>- Gains $/decayPowerC$ ThP/s
			MODULE
			{
				IDENTIFIER
				{
					name = ModuleGenerator
				}
				DATA
				{
					INPUT_RESOURCE
					{
						name = LqdTritium
						rate = #$/decayRateC$
						FlowMode = NO_FLOW
					}
					OUTPUT_RESOURCE
					{
						name = LqdHe3
						rate = #$/decayRateC$
					}
					OUTPUT_RESOURCE
					{
						name = ThermalPower
						rate = #$/decayPowerC$
					}
				}
			}
		}
		@SUBTYPE,3
		{
			descriptionSummary = #<b>Breeder tank:</b><br>- Loses $/decayPerDayD$ T/dy <br>- Gains $/decayPerDayD$ 3He/dy <br>- Gains $/decayPowerD$ ThP/s
			MODULE
			{
				IDENTIFIER
				{
					name = ModuleGenerator
				}
				DATA
				{
					INPUT_RESOURCE
					{
						name = LqdTritium
						rate = #$/decayRateD$
						FlowMode = NO_FLOW
					}
					OUTPUT_RESOURCE
					{
						name = LqdHe3
						rate = #$/decayRateD$
					}
					OUTPUT_RESOURCE
					{
						name = ThermalPower
						rate = #$/decayPowerD$
					}
				}
			}
		}
	}
}


// = = = cleanup = = =


@PART[strl-tankdrumb-*]:NEEDS[SterlingSystems/Tankage]
{
	!decay* = nope
}