@PART[strl-tankpillwg-*]:NEEDS[B9PartSwitch,SystemHeat]
{
	MODULE
	{
		name = ModuleSystemHeat
		volume = #$../mass$
		@volume *= 0.5
		moduleID = tank
		iconName = Icon_Snow
	}
	MODULE:NEEDS[CommunityResourcePack]
	{
		name = ModuleSystemHeatCryoTank
		systemHeatModuleID = tank
		BOILOFFCONFIG
		{
			FuelName = LqdAmmonia
			BoiloffRate = 0.0035
			CoolingHeatCost = 0.033
			CryocoolerTemperature = 500
		}
		BOILOFFCONFIG
		{
			FuelName = LqdCO
			BoiloffRate = 0.04
			CoolingHeatCost = 0.133
			CryocoolerTemperature = 400
		}
		BOILOFFCONFIG
		{
			FuelName = LqdCO2
			BoiloffRate = 0.005
			CoolingHeatCost = 0.05
			CryocoolerTemperature = 500
		}
		BOILOFFCONFIG
		{
			FuelName = LqdDeuterium
			BoiloffRate = 0.05
			CoolingHeatCost = 0.267
			CryocoolerTemperature = 300
		}
		BOILOFFCONFIG
		{
			FuelName = LqdHe3
			BoiloffRate = 0.05
			CoolingHeatCost = 0.267
			CryocoolerTemperature = 300
		}
		BOILOFFCONFIG
		{
			FuelName = LqdHydrogen
			BoiloffRate = 0.05
			CoolingHeatCost = 0.167
			CryocoolerTemperature = 300
		}
		BOILOFFCONFIG
		{
			FuelName = LqdMethane
			BoiloffRate = 0.005
			CoolingHeatCost = 0.067
			CryocoolerTemperature = 400
		}
		BOILOFFCONFIG
		{
			FuelName = LqdNitrogen
			BoiloffRate = 0.04
			CoolingHeatCost = 0.1
			CryocoolerTemperature = 400
		}
		BOILOFFCONFIG
		{
			FuelName = LqdOxygen
			BoiloffRate = 0.04
			CoolingHeatCost = 0.1
			CryocoolerTemperature = 350
		}
	}
	@MODULE[ModuleB9PartSwitch]:HAS[#moduleID[capacity]]
	{
		@SUBTYPE:HAS[#addedMass],*
		{
			MODULE
			{
				IDENTIFIER
				{
					name = ModuleSystemHeat
				}
				DATA
				{
					volume = #$../../#addedMass$
					@volume /= 0.5
					@volume += #$/MODULE[ModuleSystemHeat]/volume$
				}
			}
		}
	}
}


