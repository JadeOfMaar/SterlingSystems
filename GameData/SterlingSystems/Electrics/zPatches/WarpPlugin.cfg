@PART[strl-batt*]:NEEDS[WarpPlugin]
{
	%refVolumeRawCapa = #$refVolume$
	@refVolumeRawCapa *= 13.6
	@MODULE[ModuleB9PartSwitch]:HAS[#moduleID[fuelSwitch]]
	{
		SUBTYPE
		{
			name = ISC
			title = Interstellar Supercapacitor
			primaryColor = #873b3b
			secondaryColor = ResourceColorElectricChargeSecondary
			descriptionSummary = 3/4 of the container volume is dedicated to KSP Interstellar Megajoules
			RESOURCE
			{
				name = ElectricCharge
				unitsPerVolume = 5
			}
			RESOURCE
			{
				name = Megajoules
				unitsPerVolume = 20.625 // 27.5
			}
		}
	}
	MODULE
	{
		name = InterstellarDynamicResourceBuffer
		resourceName = ElectricCharge
		bufferSize = #$/refVolumeRawCapa$
	}
	MODULE
	{
		name = InterstellarResourceConverter
		primaryResourceNames = Megajoules
		secondaryResourceNames = ElectricCharge
		maxPowerPrimary = #$/refVolumeRawCapa$
		maxPowerSecondary = #$/refVolumeRawCapa$
		primaryConversionCostPower = false
		secondaryConversionCostPower = false
		primaryNormalizedDensity = 1
		secondaryNormalizedDensity = 0.001
	}
	MODULE
	{
		name = KspiSuperCapacitator
		maxStorageCapacityMJ = #$/refVolumeRawCapa$
		partMass = #$/mass$
	}
	MODULE
	{
		name  = ModuleElementRadioactiveDecay
		decayConstant  = 1.0e-6
		resourceName = Megajoules
		decayProduct = WasteHeat
		convFactor = 1
	}
}