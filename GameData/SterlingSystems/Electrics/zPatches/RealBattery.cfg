@PART[strl-batt*]:NEEDS[RealBattery]
{
	@mass *= 20
	MODULE
	{
		name = RealBattery
		BatteryTypeDisplayName = #LOC_RB_short_Li_poly
		HighEClevel = 0.95
		LowEClevel = 0.90
		Crate = 3
	}
	RESOURCE
	{
		name = ElectricCharge
		amount = #$/MODULE[ModuleB9PartSwitch],0/baseVolume$
		@amount *= 2.5
		maxAmount = #$amount$
		@maxAmount *= 8
	}
	@MODULE[ModuleB9PartSwitch]:HAS[#moduleID[fuelSwitch]]
	{
		@SUBTYPE[Li_poly]
		{
			@title = #LOC_RB_title_Li_poly
			primaryColor = #dcdcdc
			secondaryColor = #ccbc0e
			descriptionSummary = #LOC_RB_descSum_Li_poly
			descriptionDetail = #LOC_RB_descDet_Li_poly
			//upgradeRequired = RB_UpgradeLiPoly
			defaultSubtypePriority = 7
			RESOURCE
			{
				name = StoredCharge
				unitsPerVolume = 1
			}
			MODULE
			{
				IDENTIFIER
				{
					name = RealBattery
				}
				DATA
				{
					BatteryTypeDisplayName = #LOC_RB_short_Li_poly
					Crate = 3
					SelfDischargeRate = 0.015
					CycleDurability = 500
					ThermalLoss = 0.25
					TempOverheat = 420
					TempRunaway = 470
					ChargeEfficiencyCurve
					{
						key = 0.0 0.90
						key = 0.2 0.95
						key = 0.8 0.95
						key = 1.0 0.90
					}
				}
			}
		}
		SUBTYPE
		{
			name = Graphene
			title = #LOC_RB_title_Graphene
			descriptionSummary = #LOC_RB_descSum_Graphene
			descriptionDetail = #LOC_RB_descDet_Graphene
			tankType = Graphene
			upgradeRequired = RB_UpgradeGraphene
			defaultSubtypePriority = 8
			MODULE
			{
				IDENTIFIER
				{
					name = RealBattery
				}
				DATA
				{
					BatteryTypeDisplayName = #LOC_RB_title_Graphene
					Crate = 5
					SelfDischargeRate = 0.002
					CycleDurability = 2500
					ThermalLoss = 0.03
					TempOverheat = 450
					TempRunaway = 550
					ChargeEfficiencyCurve
					{
						key = 0.0   0.90
						key = 0.25  0.96
						key = 0.5   0.97
						key = 0.75  0.96
						key = 1.0   0.92
					}
				}
			}
			RESOURCE
			{
				name = ElectricCharge
				unitsPerVolume = 15
			}
			RESOURCE
			{
				name = StoredCharge
				unitsPerVolume = 2.25
			}
		}
	}
	@MODULE[ModuleB9PartSwitch]:HAS[#moduleID[capacity]]
	{
		@SUBTYPE:HAS[#addedMass],*
		{
			@addedMass *= 20
		}	addedMass = 5.247
	}
}


@PART[strl-batt-mk2|strl-batt-125|strl-batt-250|strl-batt-375|strl-batt-500]:NEEDS[RealBattery]
{
	SHvol0 = #$MODULE[ModuleB9PartSwitch],1/SUBTYPE,0/volumeAddedToParent$
	@SHvol0 += #$refVolume$
	@SHvol0 *= 0.04
	SHvol1 = #$refVolume$
	@SHvol1 *= 0.04
	SHvol2 = #$MODULE[ModuleB9PartSwitch],1/SUBTYPE,2/volumeAddedToParent$
	@SHvol2 += #$refVolume$
	@SHvol2 *= 0.04
	SHvol3 = #$MODULE[ModuleB9PartSwitch],1/SUBTYPE,3/volumeAddedToParent$
	@SHvol3 += #$refVolume$
	@SHvol3 *= 0.04
	SHvol4 = #$MODULE[ModuleB9PartSwitch],1/SUBTYPE,4/volumeAddedToParent$
	@SHvol4 += #$refVolume$
	@SHvol4 *= 0.04
	SHvol5 = #$MODULE[ModuleB9PartSwitch],1/SUBTYPE,5/volumeAddedToParent$
	@SHvol5 += #$refVolume$
	@SHvol5 *= 0.04
	
	@MODULE[ModuleB9PartSwitch]:HAS[#moduleID[capacity]]
	{
		@SUBTYPE[0]
		{
			%descriptionSummary = #$@STRLB9LOC/txtsysheat$ $@STRLB9LOC/txtsysheatvol$ $/SHvol0$ m³
			MODULE
			{
				IDENTIFIER
				{
					name = ModuleSystemHeat
					moduleID = ModuleSystemHeatRealBattery
				}
				DATA
				{
					volume = #$/SHvol0$
				}
			}
		}
		@SUBTYPE[1]
		{
			%descriptionSummary = #$@STRLB9LOC/txtsysheat$ $@STRLB9LOC/txtsysheatvol$ $/SHvol1$ m³
			MODULE
			{
				IDENTIFIER
				{
					name = ModuleSystemHeat
					moduleID = ModuleSystemHeatRealBattery
				}
				DATA
				{
					volume = #$/SHvol1$
				}
			}
		}
		@SUBTYPE[2]
		{
			%descriptionSummary = #$@STRLB9LOC/txtsysheat$ $@STRLB9LOC/txtsysheatvol$ $/SHvol2$ m³
			MODULE
			{
				IDENTIFIER
				{
					name = ModuleSystemHeat
					moduleID = ModuleSystemHeatRealBattery
				}
				DATA
				{
					volume = #$/SHvol2$
				}
			}
		}
		@SUBTYPE[3]
		{
			%descriptionSummary = #$@STRLB9LOC/txtsysheat$ $@STRLB9LOC/txtsysheatvol$ $/SHvol3$ m³
			MODULE
			{
				IDENTIFIER
				{
					name = ModuleSystemHeat
					moduleID = ModuleSystemHeatRealBattery
				}
				DATA
				{
					volume = #$/SHvol3$
				}
			}
		}
		@SUBTYPE[4]
		{
			%descriptionSummary = #$@STRLB9LOC/txtsysheat$ $@STRLB9LOC/txtsysheatvol$ $/SHvol4$ m³
			MODULE
			{
				IDENTIFIER
				{
					name = ModuleSystemHeat
					moduleID = ModuleSystemHeatRealBattery
				}
				DATA
				{
					volume = #$/SHvol4$
				}
			}
		}
		@SUBTYPE[5]
		{
			%descriptionSummary = #$@STRLB9LOC/txtsysheat$ $@STRLB9LOC/txtsysheatvol$ $/SHvol5$ m³
			MODULE
			{
				IDENTIFIER
				{
					name = ModuleSystemHeat
					moduleID = ModuleSystemHeatRealBattery
				}
				DATA
				{
					volume = #$/SHvol5$
				}
			}
		}
		
	}
}


