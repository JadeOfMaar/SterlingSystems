// = = = Battery stacks = = =


@PART[strl-batt*]:NEEDS[RealBattery]
{
	SHvol1 = #$refVolume$
	@SHvol1 *= 0.04
	@mass *= 20
	MODULE
	{
		name = RealBattery
		ChemistryID = Li_poly
		EVAupgrade  = none // target SUBTYPE name; "none" = upgrade prohibited
	}
	MODULE
	{
		name = ModuleSystemHeat
		moduleID = ModuleSystemHeatRealBattery
		volume = #$/SHvol1$
		iconName = Icon_Gears
	}
	// RESOURCE
	// {
		// name = ElectricCharge
		// amount = #$/MODULE[ModuleB9PartSwitch],0/baseVolume$
		// @amount *= 2.5
		// maxAmount = #$amount$
		// @maxAmount *= 8
	// }
	@MODULE[ModuleB9PartSwitch]:HAS[#moduleID[fuelSwitch]]
	{
		@baseVolume *= 5
		@SUBTYPE[Li_poly]
        {
			@title = #LOC_RB_title_Li_poly
			%descriptionSummary = #LOC_RB_descSum_Li_poly
			%descriptionDetail = #LOC_RB_descDet_Li_poly
			%tankType = Li_poly
			%defaultSubtypePriority = 10
            MODULE
            {
                IDENTIFIER
                {
                    name = RealBattery
                }
                DATA
                {
                    ChemistryID = Li_poly
                    EVAupgrade  = Graphene // target SUBTYPE name; "none" = upgrade prohibited
                }
            }
        }
        SUBTYPE
        {
            name = Graphene
            title = #LOC_RB_title_Graphene
            descriptionSummary = #LOC_RB_descSum_Graphene
            descriptionDetail = #LOC_RB_descDet_Graphene
            tankType = Graphene
            upgradeRequired = RB_UpgradeGraphene
            defaultSubtypePriority = 11
            MODULE
            {
                IDENTIFIER
                {
                    name = RealBattery
                }
                DATA
                {
                    ChemistryID = Graphene
                    EVAupgrade  = none // target SUBTYPE name; "none" = upgrade prohibited
                }
            }
        }
	}
	@MODULE[ModuleB9PartSwitch]:HAS[#moduleID[capacity]]
	{
		@SUBTYPE:HAS[#addedMass],*
		{
			@addedMass *= 20
		}
	}
}


@PART[strl-batt-mk2|strl-batt-125|strl-batt-250|strl-batt-375|strl-batt-500]:NEEDS[RealBattery]
{
	SHvol0 = #$MODULE[ModuleB9PartSwitch],1/SUBTYPE,0/volumeAddedToParent$
	@SHvol0 += #$refVolume$
	@SHvol0 *= 0.04
	SHvol2 = #$MODULE[ModuleB9PartSwitch],1/SUBTYPE,2/volumeAddedToParent$
	@SHvol2 += #$refVolume$
	@SHvol2 *= 0.04
	SHvol3 = #$MODULE[ModuleB9PartSwitch],1/SUBTYPE,3/volumeAddedToParent$
	@SHvol3 += #$refVolume$
	@SHvol3 *= 0.04
	SHvol4 = #$MODULE[ModuleB9PartSwitch],1/SUBTYPE,4/volumeAddedToParent$
	@SHvol4 += #$refVolume$
	@SHvol4 *= 0.04
	SHvol5 = #$MODULE[ModuleB9PartSwitch],1/SUBTYPE,5/volumeAddedToParent$
	@SHvol5 += #$refVolume$
	@SHvol5 *= 0.04
	
	@MODULE[ModuleB9PartSwitch]:HAS[#moduleID[capacity]]
	{
		@SUBTYPE[0]
		{
			%descriptionSummary = #$@STRLB9LOC/txtsysheat$ $@STRLB9LOC/txtsysheatvol$ $/SHvol0$ m³
			MODULE
			{
				IDENTIFIER
				{
					name = ModuleSystemHeat
					moduleID = ModuleSystemHeatRealBattery
				}
				DATA
				{
					volume = #$/SHvol0$
				}
			}
		}
		@SUBTYPE[1]
		{
			%descriptionSummary = #$@STRLB9LOC/txtsysheat$ $@STRLB9LOC/txtsysheatvol$ $/SHvol1$ m³
			MODULE
			{
				IDENTIFIER
				{
					name = ModuleSystemHeat
					moduleID = ModuleSystemHeatRealBattery
				}
				DATA
				{
					volume = #$/SHvol1$
				}
			}
		}
		@SUBTYPE[2]
		{
			%descriptionSummary = #$@STRLB9LOC/txtsysheat$ $@STRLB9LOC/txtsysheatvol$ $/SHvol2$ m³
			MODULE
			{
				IDENTIFIER
				{
					name = ModuleSystemHeat
					moduleID = ModuleSystemHeatRealBattery
				}
				DATA
				{
					volume = #$/SHvol2$
				}
			}
		}
		@SUBTYPE[3]
		{
			%descriptionSummary = #$@STRLB9LOC/txtsysheat$ $@STRLB9LOC/txtsysheatvol$ $/SHvol3$ m³
			MODULE
			{
				IDENTIFIER
				{
					name = ModuleSystemHeat
					moduleID = ModuleSystemHeatRealBattery
				}
				DATA
				{
					volume = #$/SHvol3$
				}
			}
		}
		@SUBTYPE[4]
		{
			%descriptionSummary = #$@STRLB9LOC/txtsysheat$ $@STRLB9LOC/txtsysheatvol$ $/SHvol4$ m³
			MODULE
			{
				IDENTIFIER
				{
					name = ModuleSystemHeat
					moduleID = ModuleSystemHeatRealBattery
				}
				DATA
				{
					volume = #$/SHvol4$
				}
			}
		}
		@SUBTYPE[5]
		{
			%descriptionSummary = #$@STRLB9LOC/txtsysheat$ $@STRLB9LOC/txtsysheatvol$ $/SHvol5$ m³
			MODULE
			{
				IDENTIFIER
				{
					name = ModuleSystemHeat
					moduleID = ModuleSystemHeatRealBattery
				}
				DATA
				{
					volume = #$/SHvol5$
				}
			}
		}
		
	}
