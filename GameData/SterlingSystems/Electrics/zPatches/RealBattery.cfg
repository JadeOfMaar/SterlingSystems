// = = = Betavoltaics = = =


@PART[strl-rctrbv*]:NEEDS[RealBattery]
{
	!MODULE[ModuleGenerator] {}
	MODULE
	{
		name = RealBattery
		BatteryTypeDisplayName = #LOC_RB_short_Nuke
		Crate = 0.001
		SelfDischargeRate = 0.0001			
		CycleDurability = 1
		ThermalLoss = 0.4
		ChargeEfficiencyCurve
		{
			key = 0.0 0.0
			key = 1.0 0.0
		}
	}
	MODULE
	{
		name = ModuleB9PartSwitch
		moduleID = batterySwitch
		switcherDescription = #LOC_RB_batterySwitcherDescription
		switcherDescriptionPlural = #LOC_RB_batterySwitcherDescriptionPlural
		baseVolume = #$/refVolume$
		SUBTYPE
		{
			name = NukeCell
			title = #LOC_RB_short_Nuke
			descriptionSummary = #LOC_RB_descSum_Nuke
			descriptionDetail = #LOC_RB_descDet_Nuke
			tankType = NukeCell
			// upgradeRequired = RB_UpgradeNuke
			// defaultSubtypePriority = 0
			MODULE
			{
				IDENTIFIER
				{
					name = RealBattery
				}
				DATA
				{
					BatteryTypeDisplayName = #LOC_RB_short_Nuke

					FixedOutput = false
					KeepWarm = false
					SelfRunaway = true

					HighEClevel = 2
					Crate = 0.001

					SelfDischargeRate = 0.0001            
					CycleDurability = 1
					EvaRefurbishEnabled = false
					SparePartsPerKWh = 2

					ThermalLoss = 0.12
					TempOverheat = 1500
					TempRunaway = 2500
					RunawayHeatFactor = 750

					ChargeEfficiencyCurve
					{
						key = 0.0 0.0
						key = 1.0 0.0
					}
				}
			}
		}
	}
}