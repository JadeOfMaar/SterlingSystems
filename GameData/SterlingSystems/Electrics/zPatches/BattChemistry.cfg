@PART[strl-batt*]:NEEDS[!RealBattery]
{
	MODULE
	{
		name = ModuleSystemHeat
		volume = #$/refVolume$
		moduleID = default
		iconName = Icon_Tank
		ignoreTemperature = true
	}
	MODULE
	{
		name = ModuleSystemHeatCryoTank
		systemHeatModuleID = tank
		BOILOFFCONFIG
		{
			FuelName = MagneticCharge
			BoiloffRate = 0.5
			CoolingHeatCost = 1.5
			CryocoolerTemperature = 300
		}
	}
	@MODULE[ModuleB9PartSwitch]:HAS[#moduleID[fuelSwitch]]
	{
		SUBTYPE
		{
			name = Graphene
			title = Graphene
			tankType = strl-battcarbon
			upgradeRequired = strl-upgrade-batt1
			// MATERIAL
			// {
				// name = Basic
				// transform = IDBand
				// COLOR
				// {
					// color = #DCB558 // Batt Yellow
				// }
			// }
		}
		SUBTYPE
		{
			name = Magnetic
			title = Superconducting Magnetic
			tankType = strl-battmag
			upgradeRequired = strl-upgrade-batt2
			// MATERIAL
			// {
				// name = Basic
				// transform = IDBand
				// COLOR
				// {
					// color = #498FCC // Cryo-ish
				// }
			// }
		}
	}
	MODULE
	{
		name = ModuleSystemHeatConverter
		moduleID = TrickleCharger
		// IsActivated = true
		systemHeatModuleID = default
		shutdownTemperature = 355
		systemOutletTemperature = 300
		systemPower = 0.25
		@systemPower *= #$/refVolume$
		@systemPower /= 2400
		systemEfficiency
		{
			key = 0 1
			key = 300 1 0 -0.01
			key = 400 0
		}
		ConverterName = Trickle Charger
		StartActionName = Start Trickle Charger
		StopActionName = Stop Trickle Charger
		ToggleActionName = Toggle Trickle Charger
		FillAmount = 1
		AutoShutdown = False
		GeneratesHeat = False
		UseSpecialistBonus = False
		INPUT_RESOURCE
		{
			ResourceName = ElectricCharge
			Ratio = 250
			@Ratio *= #$/refVolume$
			@Ratio /= 2400
		}
		OUTPUT_RESOURCE
		{
			ResourceName = MagneticCharge
			Ratio = 0.25
			@Ratio *= #$/refVolume$
			@Ratio /= 2400
		}
	}
	MODULE
	{
		name = ModuleSystemHeatConverter
		moduleID = FastCharger
		systemHeatModuleID = default
		shutdownTemperature = 355
		systemOutletTemperature = 300
		systemPower = 1.25
		@systemPower *= #$/refVolume$
		@systemPower /= 2400
		systemEfficiency
		{
			key = 0 1
			key = 300 1 0 -0.01
			key = 400 0
		}
		ConverterName = Fast Charger
		StartActionName = Start Fast Charger
		StopActionName = Stop Fast Charger
		ToggleActionName = Toggle Fast Charger
		FillAmount = 1
		AutoShutdown = False
		GeneratesHeat = False
		UseSpecialistBonus = False
		INPUT_RESOURCE
		{
			ResourceName = ElectricCharge
			Ratio = 1250
			@Ratio *= #$/refVolume$
			@Ratio /= 2400
		}
		OUTPUT_RESOURCE
		{
			ResourceName = MagneticCharge
			Ratio = 1.25
			@Ratio *= #$/refVolume$
			@Ratio /= 2400
		}
	}
	MODULE
	{
		name = ModuleSystemHeatConverter
		moduleID = Discharger
		systemHeatModuleID = default
		shutdownTemperature = 355
		systemOutletTemperature = 300
		systemPower = 5
		@systemPower *= #$/refVolume$
		@systemPower /= 2400
		systemEfficiency
		{
			key = 0 1
			key = 300 1 0 -0.01
			key = 400 0
		}
		ConverterName = Discharger
		StartActionName = Start Discharger
		StopActionName = Stop Discharger
		ToggleActionName = Toggle Discharger
		FillAmount = 1
		AutoShutdown = False
		GeneratesHeat = False
		UseSpecialistBonus = False
		INPUT_RESOURCE
		{
			ResourceName = MagneticCharge
			Ratio = 5
			@Ratio *= #$/refVolume$
			@Ratio /= 2400
		}
		OUTPUT_RESOURCE
		{
			ResourceName = ElectricCharge
			Ratio = 5000
			@Ratio *= #$/refVolume$
			@Ratio /= 2400
		}
	}
}