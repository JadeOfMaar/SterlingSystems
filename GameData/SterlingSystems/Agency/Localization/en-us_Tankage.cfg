		#LOC_strl_FissilePebbles_Description = Pebbles... More like white hot little candies! We're keeping lots and lots of those in here. Don't ask up how they don't manage to let themselves out or how they don't cool themselves down while waiting their turn.
		#LOC_strl_FizzledPebbles_Description = All bright lights go dim sometime... That is the case for these. They might still have enough juice to keep a tent warm on an ice world so that's something.
