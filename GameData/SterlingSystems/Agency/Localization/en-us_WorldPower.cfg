		#LOC_strl-worldpower-batt_desc = The chancellor Janorious F. Kerman of orbital colony Tylo 5 once said this: If ever you think you've built enough in, think again. There is always a darker night and a bigger grid will need a harder kick if it fails.
		
		#LOC_strl-worldpower-maec1x_title = Sterling World Power MAEC 1x
