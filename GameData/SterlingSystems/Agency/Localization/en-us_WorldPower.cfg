		#LOC_strl-worldpower-tcs_desc = An incredibly powerful open cycle thermal control system, the Gulf Stream series relies entirely on plumbing waste heat into an active stream of high pressure fluid. By consequence, it can only be used if the given celestial body has abundant atmosphere or a vast store of expendable water.
