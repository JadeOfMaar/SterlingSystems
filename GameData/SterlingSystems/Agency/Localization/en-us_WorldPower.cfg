		#LOC_strl-worldpower-sink_desc = A fact of life is that a lot of heavy industry runs on pure heat and not so much on electricity. Like the inline heatsinks for traveling vessels, the heatsink cube offers awesome loop volume and a high powered radiator so we can dump waste heat from the cold side of our machines.		
		
		#LOC_strl-worldpower-tcs1x_title = Sterling World Power Gulf Stream 1x TCS
