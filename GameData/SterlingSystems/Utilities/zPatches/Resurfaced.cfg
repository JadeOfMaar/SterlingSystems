SHABBY_MATERIAL_DEF:NEEDS[Resurfaced]
{
	name = strl-cylRefinery
	shader = Resurfaced/Standard
	TEXTURE
	{
		_MainTex  = SterlingSystems/Utilities/RefineriesCirc/CylRefinery_DIFF
		_MetalMap = SterlingSystems/Utilities/RefineriesCirc/CylRefinery_MTL
		_BumpMap  = SterlingSystems/Utilities/RefineriesCirc/CylRefinery_NRM
