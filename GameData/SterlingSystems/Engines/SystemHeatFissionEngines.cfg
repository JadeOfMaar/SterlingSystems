// Solid core NTR
@PART[strl-eng-*-suleu]:NEEDS[SystemHeat,!RationalResourcesNuclearFamily]
{
	%nucFuelScale = #$mass$
	@nucFuelScale /= 1.8	
	@nucFuelScale += 0.005
	@nucFuelScale *= 100
	@nucFuelScale = #$nucFuelScale[0,.]$ // regex truncate, unknown behavior but used in RO
	@nucFuelScale /= 100
	
	// get relative power for System Heat
	SHScaleIsp1 = #$MODULE[ModuleEnginesFX],0/atmosphereCurve/key,0[1, ]$ // get vac Isp number
	@SHScaleIsp1 /= 800
	SHScaleThrust1 = #$MODULE[ModuleEnginesFX],0/maxThrust$
	@SHScaleThrust1 /= 130
	SHPower1 = -200
	@SHPower1 *= #$SHScaleIsp$
	@SHPower1 *= #$SHScaleThrust$
	@SHPower1 += 0.005
	@SHPower1 *= 100
	@SHPower1 = #$SHPower1[0,.]$ // regex truncate, unknown behavior but used in RO
	@SHPower1 /= 100
	
	@MODULE[ModuleEngines*]
	{
		@heatProduction = 0
	}
	MODULE
	{
		name = ModuleSystemHeat
		volume = #$/mass$
		@volume /= 3
		moduleID = engine
		iconName = Icon_Nuclear
	}
	MODULE
	{
		name = ModuleSystemHeatEngine
		moduleID = engineHeat
		systemHeatModuleID = reactor
		systemPower = #$/SHPower1$
		systemOutletTemperature = 1100
		shutdownTemperature = 1500
		temperatureCurve
		{
			key = 0 0
			key = 700 0 0 0
			key = 1000 0.5
			key = 1100 1
			key = 1200 0.5
			key = 1500 0 0 0
		}
	}
	MODULE
	{
		name = ModuleSystemHeatConverter
		moduleID = #LOC_strl_reactor_fission // Fission Reactor
		systemHeatModuleID = reactor
		shutdownTemperature = 1500
		systemOutletTemperature = 1100 // temp for freeing water from hydrate regolith. other values could be: 400k for production of hydrazine, 5-600k for decomposition of hydrates, 700 for sabatier process, 373-1000k for high temp electrolysis of water.
		systemPower = 1275 // 0.5% net energy
		@systemPower *= #$/nucFuelScale$
		systemEfficiency
		{
			key = 0 0
			key = 700 0 0 0
			key = 1000 0.5
			key = 1100 1
			key = 1200 0.5
			key = 1500 0 0 0
		}
		ConverterName = #LOC_strl_reactor_fission // Fission Reactor
		StartActionName = #LOC_strl_reactor_start // Start Reactor
		StopActionName = #LOC_strl_reactor_stop // Stop Reactor
		ToggleActionName = #LOC_strl_reactor_toggle //Toggle Reactor
		FillAmount = 1
		AutoShutdown = False
		GeneratesHeat = False
		UseSpecialistBonus = False
		INPUT_RESOURCE
		{
			ResourceName = FissilePebbles
			Ratio = 0.0000012361825
			@Ratio *= #$/nucFuelScale$
			FlowMode = STAGE_PRIORITY_FLOW
		}
		OUTPUT_RESOURCE
		{
			ResourceName = FizzledPebbles
			Ratio = 0.0000012361825
			@Ratio *= #$/nucFuelScale$
			DumpExcess = false
			FlowMode = ALL_VESSEL
		}
		OUTPUT_RESOURCE
		{
			ResourceName = ThermalPower
			Ratio = 253.725 // 255 // 99.5% net energy
			@Ratio *= #$/nucFuelScale$
			DumpExcess = false
			FlowMode = ALL_VESSEL
		}
	}
}

