// OG Thermal Nozzles
@PART[strl-eng-*-thnozbell|strl-eng-062-thnr-01]:NEEDS[SystemHeat,!RationalResourcesNuclearFamily]
{
	// get relative power for System Heat
	SHScaleIsp1 = #$MODULE[ModuleEnginesFX],0/atmosphereCurve/key,0[1, ]$ // get vac Isp number
	@SHScaleIsp1 /= 800
	SHScaleThrust1 = #$MODULE[ModuleEnginesFX],0/maxThrust$
	@SHScaleThrust1 /= 2400
	SHPower1 = -2400
	@SHPower1 *= #$SHScaleIsp1$
	@SHPower1 *= #$SHScaleThrust1$
	@SHPower1 += 0.005
	@SHPower1 *= 100
	@SHPower1 = #$SHPower1[0,.]$ // regex truncate, unknown behavior but used in RO
	@SHPower1 /= 100
	
	@MODULE[ModuleEngines*]
	{
		@heatProduction = 0
	}
	
	MODULE
	{
		name = ModuleSystemHeat
		// Cubic metres
		volume = #$/mass$
		@volume /= 3
		moduleID = engine
		iconName = Icon_Engine
	}
	MODULE
	{
		name = ModuleSystemHeatEngine
		moduleID = engineHeat
		systemHeatModuleID = engine
		engineModuleID = #$/MODULE[ModuleEnginesFX],0/engineID$
		systemPower = #$/SHPower1$
		systemOutletTemperature = 1300
		shutdownTemperature = 1800
		temperatureCurve
		{
			key = 0 0
			key = 260 0.002
			key = 520 0.026
			key = 780 0.13
			key = 1040 0.41
			key = 1300 1
		}
	}
}


