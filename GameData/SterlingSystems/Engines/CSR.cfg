@PART[strl-eng-500-icf]:NEEDS[ClassicStock]
{
	RESOURCE
	{
		name = FusionPellets
		amount = 5000
		maxAmount = 5000
	}
	@MODULE[ModuleEnginesFX]
	{
		@PROPELLANT,0
		{
			@name = FusionPellets
		}
	}
	MODULE:NEEDS[!SystemHeat]
	{
		name = ModuleResourceConverter
		ConverterName = FusionPellets
		StartActionName = Start ISRU [FusionPellets]
		StopActionName = Stop ISRU [FusionPellets]
		ToggleActionName = Toggle ISRU [FusionPellets]
		EfficiencyBonus = 1

		INPUT_RESOURCE
		{
			ResourceName = Propellium
			Ratio = 0.1
			FlowMode = STAGE_PRIORITY_FLOW
		}
		INPUT_RESOURCE
		{
			ResourceName = Hexagen
			Ratio = 0.4
			FlowMode = STAGE_PRIORITY_FLOW
		}
		INPUT_RESOURCE
		{
			ResourceName = ElectricCharge
			Ratio = 50
		}
		OUTPUT_RESOURCE
		{
			ResourceName = FusionPellets
			Ratio = 0.184375
			DumpExcess = False
			FlowMode = STAGE_PRIORITY_FLOW
		}
	}
}

