// MCF
@PART[strl-eng-375-mcf]:NEEDS[SystemHeat,!RationalResourcesNuclearFamily]
{
	// get relative power for System Heat
	SHScaleIsp1 = #$MODULE[ModuleEnginesFX],0/atmosphereCurve/key,0[1, ]$ // get vac Isp number
	@SHScaleIsp1 /= 35000
	SHScaleThrust1 = #$MODULE[ModuleEnginesFX],0/maxThrust$
	@SHScaleThrust1 /= 200
	SHPower1 = 14000
	@SHPower1 *= #$SHScaleIsp$
	@SHPower1 *= #$SHScaleThrust$
	@SHPower1 += 0.005
	@SHPower1 *= 100
	@SHPower1 = #$SHPower1[0,.]$ // regex truncate, unknown behavior but used in RO
	@SHPower1 /= 100
	SHScaleIsp2 = #SHPower1$ // get vac Isp number
	@SHScaleIsp2 *= 0.6
	
	@MODULE[ModuleEnginesFX],*
	{
		@heatProduction = 0
	}
	
	MODULE
	{
		name = ModuleSystemHeat
		// Cubic metres
		volume = #$/mass$
		moduleID = reactor
		iconName = Icon_Atom
	}
	MODULE:NEEDS[FarFutureTechnologies]
	{
		name = ModuleFusionEngine

		// General Parameters
		Enabled = False
		MinimumReactorPower = 0.5

		// Charge Parameters
		Charged = false
		ChargeRate = 50
		ChargeAmount = 0
		ChargeGoal = 3500
		@ChargeGoal *= #$/SHScaleThrust1$

		// Animation Parameters
		// ChargingLightRootTransformName = SpikeLightPanel
		// OnLightTransformName = LightOn
		// OffLightTransformName = LightOff
		// ModeLightTransformName = LightMode
		// OverheatColorChangerName = ""

		// Thermal Parameters
		// must be unique
		ModuleID = fusionreactor
		// ModuleSystemHeat to link to
		HeatModuleID = reactor

		SystemPower = 500
		@SystemPower *= #$/SHScaleThrust1$
		// The shutdown temperature of the part
		ShutdownTemperature = 1600
		// The temperature the system contributes to loops
		SystemOutletTemperature = 1200
		FUSIONMODE
		{
			DisplayName = #LOC_FFT_fusion-reactor_fusion-mode_d-he3
			ModeID = DH3
			ModeColor = 0.03, 0.45, 0.36, 0.5
			PowerGeneration = 25
			INPUT_RESOURCE
			{
				ResourceName = LqdDeuterium
				Ratio = 0.00436
				FlowMode = STAGE_PRIORITY_FLOW
			}
			INPUT_RESOURCE
			{
				ResourceName = LqdHe3
				Ratio = 0.01744
				FlowMode = STAGE_PRIORITY_FLOW
			}
		}
	}
	MODULE
	{
		name = ModuleSystemHeatEngine
		moduleID = engine1
		systemHeatModuleID = reactor
		engineModuleID = Light
		systemPower = #$/SHPower1$
		systemOutletTemperature = 1200
		shutdownTemperature = 1600
		temperatureCurve
		{
			key = 0 0
			key = 800 0 0 0
			key = 1100 0.5
			key = 1200 1
			key = 1300 0.5
			key = 1600 0 0 0
		}
	}
	MODULE
	{
		name = ModuleSystemHeatEngine
		moduleID = engine2
		systemHeatModuleID = reactor
		engineModuleID = Heavy
		systemPower = #$/SHPower2$
		systemOutletTemperature = 1200
		shutdownTemperature = 1600
		temperatureCurve
		{
			key = 0 0
			key = 800 0 0 0
			key = 1100 0.5
			key = 1200 1
			key = 1300 0.5
			key = 1600 0 0 0
		}
	}
}

