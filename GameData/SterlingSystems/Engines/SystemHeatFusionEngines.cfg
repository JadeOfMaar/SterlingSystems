@PART[strl-eng-500-icf]:NEEDS[SystemHeat,!RationalResourcesNuclearFamily]
{
	MODULE
	{
		name = ModuleSystemHeat
		// Cubic metres
		volume = #$/mass$
		@volume *= 0.9
		moduleID = reactor
		iconName = Icon_Atom
		currentLoopID = 0
	}
}
