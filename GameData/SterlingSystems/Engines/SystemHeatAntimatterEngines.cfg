// BCAM
@PART[strl-eng-1000-bcam]:NEEDS[SystemHeat]
{
	// get relative power for System Heat
	SHScaleIsp1 = #$MODULE[ModuleEnginesFX],0/atmosphereCurve/key,0[1, ]$ // get vac Isp number
	@SHScaleIsp1 /= 10190000
	SHScaleThrust1 = #$MODULE[ModuleEnginesFX],0/maxThrust$
	@SHScaleThrust1 /= 4000
	SHPower1 = 36000
	@SHPower1 *= #$SHScaleIsp1$
	@SHPower1 *= #$SHScaleThrust1$
	@SHPower1 += 0.005
	@SHPower1 *= 100
	@SHPower1 = #$SHPower1[0,.]$ // regex truncate, unknown behavior but used in RO
	@SHPower1 /= 100
	
	@MODULE[ModuleEngines*]
	{
		@heatProduction = 0
	}
	MODULE
	{
		name = ModuleSystemHeat
		// Cubic metres
		volume = #$/mass$
		@volume /= 3
		moduleID = engine
		iconName = Icon_Atom
	}
	MODULE
	{
		name = ModuleSystemHeatEngine
		moduleID = engine
		systemHeatModuleID = engine
		engineModuleID = AntimatterBeam
		systemPower = 36000 // x0.1 as Sterling BCAM has 10x Isp to be playable
		@systemPower *= #$/SHPower1$
		systemOutletTemperature = 1800
		shutdownTemperature = 2000
		temperatureCurve
		{
			key = 0 1
			key = 1800 1
			key = 1900 0.5
			key = 2200 0 0 0
		}
	}
}