// OG TN-DL Bells
@PART[strl-eng-???-thnozbell*]:NEEDS[StockWaterfallEffects]
{
	MODULE
	{
		name = ModuleWaterfallFX
		moduleID = #$/MODULE[ModuleEnginesFX],0/engineID$
		CONTROLLER
		{
			name = atmosphereDepth
			linkedTo = atmosphere_density
		}
		CONTROLLER
		{
			name = throttle
			linkedTo = throttle
			engineID = #$/MODULE[ModuleEnginesFX],0/engineID$
		}
		CONTROLLER
		{
			name = random
			linkedTo = random
			range = 0.7, 1
		}
		CONTROLLER
		{
			name = Ignition
			linkedTo = engineEvent
			eventDuration = 2
			eventName = ignition
			eventCurve
			{
				key = 0 0 10 10
				key = 0.1 1 4.444445 4.444445
				key = 1 0 -1.111111 -1.111111
			}
		}
		TEMPLATE
		{
			templateName = waterfall-hydrolox-rs25-2
			overrideParentTransform = thrustTransform
			position = 0, 0, 0
			rotation = 0, 0, 0
			scale = 1.0, 1.0, 1.0
		}
	}
}
@PART[strl-eng-250-thnozbell*]:NEEDS[StockWaterfallEffects]
{
	@MODULE[ModuleWaterfallFX]
	{
		@TEMPLATE
		{
			@position = 0, 0, 0
			@rotation = 0, 0, 0
			@scale = 2.0, 2.0, 1.5
		}
	}
}
