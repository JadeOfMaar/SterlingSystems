SHABBY_MATERIAL_DEF
{
    name = FlickerFixScroll
    updateExisting = true
    shader = SterlingSystems/ScrollingUnlitFlickerFix  // Sterling Systems uses four different shaders for the scroll effect, but only one is different. The only difference is scroll speed 20 vs scroll speed 7.
    preserveRenderQueue = false
}

@PART[strl-rad-lfr-sta*]:AFTER[SterlingSystems]
{
    SHABBY_MATERIAL_REPLACE
    {
        materialDef = FlickerFixScroll
        targetTransform = Scroll
    }
}