@PART[strl-worldpower-sink*]:NEEDS[SystemHeat]
{
	refVolume0 = #$refVolume$
	refVolume2 = #$refVolume$
	@refVolume0 *= 0.04
	@refVolume2 *= 2.535
	MODULE
	{
		name = ModuleSystemHeat
		volume = #$/refVolume$
		@volume *= 0.04 // 6.12
		moduleID = sink
		iconName = Icon_Tank
		ignoreTemperature = true
	}
	!MODULE[ModuleAnimateHeat] {}
	MODULE
	{
		name = ModuleSystemHeatColorAnimator
