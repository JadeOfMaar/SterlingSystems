// - - - - - Basic

@PART[strl-worldpower-wm?]:NEEDS[!Benjee10_MMSEV,!Kerbalism]
{
	MODULE
	{
		name = ModuleAnimationGroup
		deployAnimationName = unboxing
		activeAnimationName = turbineSpin
		deployActionName = Deploy Turbine
		retractActionName = Retract Turbine
		toggleActionName = Toggle packaging
		moduleType = Generator
	}
}


// - - - - - Planetside Exploration Tech


@PART[strl-worldpower-wm?]:NEEDS[Benjee10_MMSEV]
{
	!MODULE[ModuleResourceConverter] {}
	MODULE
	{
		name = ModulePETTurbine
		turbineType = Vertical-Axis

		turbinePivotName = rotorYaw // turbine spin axis. Counterclockwise at Z+
		rotationPivotName = dummy

		isBreakable = true
		breakName = breakPoint
		requiredRepairKits = 6

		turbineSpeedMult = 1.0
		rotationSpeedMult = 10.0

		minWindSpeed = 0.4 // 1 = 100%
		maxWindTolerance = 7.0 // 1 = 100%

		chargeRate = 160.0 
		resourceName = ElectricCharge

		atmEfficiencyCurve
		{
			key = 0 0
			key = 0.07 0.5 0.9 0.9
			key = 1 1
			key = 5 1.2
		}
		showWindDirection = false
		
		animationName = unboxing
		extendActionName = Deploy Turbine
		retractActionName = Retract Turbine
		extendpanelsActionName = Toggle packaging
	}
}
@PART[strl-worldpower-wm2]:NEEDS[Benjee10_MMSEV]
{
	@MODULE[ModulePETTurbine]
	{
		@minWindSpeed = 0.4 // 1 = 100%
		@maxWindTolerance = 30.0 // 1 = 100%
		@chargeRate = 480
		@requiredRepairKits = 15
	}
}