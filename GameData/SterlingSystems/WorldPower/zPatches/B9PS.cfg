@PART[strl-worldpower-rad1]:NEEDS[B9PartSwitch]
{
	
	MODULE
	{
		name = ModuleB9PartSwitch
		moduleID = Service
		switcherDescription = #LOC_strl_subtype_Service
		switcherDescriptionPlural = #LOC_strl_subtype_Services
		SUBTYPE
		{
			name = 01
			title = Cryo
			descriptionSummary = #$@STRLB9LOC/txtsysheat$ $@STRLB9LOC/txtsysheatpwr$ $/refPower$ kW @ 0.12 EC/s $@STRLB9LOC/txtsysheattemp$ $/refTemp$ K
			primaryColor = #45909f
			secondaryColor = #52b8cc
			transform = panelRadLow
			maxTemp = 1500
		}
		SUBTYPE
		{
			name = 02
			title = ISRU
			descriptionSummary = #$@STRLB9LOC/txtsysheat$ $@STRLB9LOC/txtsysheatpwr$ $/refPowerB$ kW @ 0.51 EC/s $@STRLB9LOC/txtsysheattemp$ $/refTempB$ K
			transform = panelRadLow
			primaryColor = #6c2100
			secondaryColor = #802b00
			addedCost = -515
			maxTemp = 1800
			MODULE
			{
				IDENTIFIER
				{
					name = ModuleActiveRadiator
				}
				DATA
				{
					maxEnergyTransfer = #$/refPowerB$
					@maxEnergyTransfer *= 50
					overcoolFactor = 1
					RESOURCE
					{
						name = ElectricCharge
						rate = 0.51
					}
				}
			}
		}
		SUBTYPE
		{
			name = 03
			title = Nuclear
			descriptionSummary = #$@STRLB9LOC/txtsysheat$ $@STRLB9LOC/txtsysheatpwr$ $/refPowerC$ kW $@STRLB9LOC/txtsysheattemp$ $/refTempC$ K
			transform = panelRadHigh
			primaryColor = #c18b12
			secondaryColor = #e5b217
			addedCost = 1560
			maxTemp = 2000
			MODULE
			{
				IDENTIFIER
				{
					name = ModuleActiveRadiator
				}
				DATA
				{
					maxEnergyTransfer = #$/refPowerC$
					@maxEnergyTransfer *= 50
					overcoolFactor = 1
					RESOURCE
					{
						name = ElectricCharge
						rate = 0
					}
				}
			}
		}
	}
}

@PART[strl-worldpower-*]:HAS[~hasUnderground[false]]:NEEDS[B9PartSwitch]
{
	MODULE
	{
		name = ModuleB9PartSwitch
		moduleID = Underground
		switcherDescription = Underground
		SUBTYPE
		{
			name = On
			transform = Underground
		}
		SUBTYPE
		{
			name = Off
			primaryColor = gray
			secondaryColor = gray
		}
	}
}

@PART[strl-worldpower-pv1]:NEEDS[B9PartSwitch]
