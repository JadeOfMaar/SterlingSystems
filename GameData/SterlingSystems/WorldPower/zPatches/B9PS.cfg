@PART[strl-worldpower-pv?]:NEEDS[B9PartSwitch]
{
	MODULE
	{
		name = ModuleB9PartSwitch
		moduleID = Quality
		switcherDescription = Quality
		switcherDescriptionPlural = Qualities
		SUBTYPE
		{
			name = b1x
			title = Advanced
			primaryColor = ClearBlue
			secondaryColor = ClearBlue
			descriptionSummary = #$@STRLB9LOC/elec_solarCell$ $@STRLB9LOC/elec_chargeRate$ $/refPower$ EC/s
			transform = panelAdv
			maxTemp = 1500
		}
		SUBTYPE
		{
			name = c1x
			title = Concentrator
			primaryColor = Charcoal
			secondaryColor = Charcoal
			upgradeRequired = strl-upgrade-solar2
			descriptionSummary = #$@STRLB9LOC/elec_solarCell$ $@STRLB9LOC/elec_chargeRate$ $/refPowerB$ EC/s $@STRLB9LOC/txtIntroUnlock$ $@STRLB9LOC/wrappv_unlock2$
			transform = panelConc
			addedCost = #$/addCost$
			maxTemp = 1800
			MODULE
			{
				IDENTIFIER
				{
					name = ModuleDualAxisSolarPanel
				}
				DATA
				{
					chargeRate = #$/refPowerB$
				}
			}
		}
	}
}
@PART[strl-worldpower-sthm|strl-worldpower-sths]:NEEDS[B9PartSwitch]
{
	MODULE
	{
		name = ModuleB9PartSwitch
		moduleID = Heading
		switcherDescription = Heading
		switcherDescriptionPlural = Headings
		SUBTYPE
		{
			name = 01
			title = -60 deg
			TRANSFORM
			{
				name = rotorYaw
				rotationOffset = 0, -60, 0
			}
		}
		SUBTYPE
		{
			name = 02
			title = 0 deg
			defaultSubtypePriority = 1
			TRANSFORM
			{
				name = rotorYaw
				rotationOffset = 0, 0, 0
			}
		}
		SUBTYPE
		{
			name = 03
			title = 60 deg
			TRANSFORM
			{
				name = rotorYaw
				rotationOffset = 0, 60, 0
			}
		}
	}
}
@PART[strl-worldpower-tcs?]:NEEDS[B9PartSwitch,CommunityResourcePack]
{
	MODULE
	{
		name = ModuleB9PartSwitch
		moduleID = Coolant
		// switcherDescription = Coolant
		// switcherDescriptionPlural = Coolants
		switchInFlight = True
		baseVolume = #$/refVolume$
		@baseVolume -= 3200 // no condenser
		@baseVolume /= 25
		SUBTYPE
		{
			name = Air
			title = Intake Atmosphere
			primaryColor = LightGrey
			secondaryColor = LightGrey
			descriptionSummary = #$@STRLB9LOC/txtsysheat$ $@STRLB9LOC/txtsysheatvol$ $/refVolume0$ m³
			RESOURCE
			{
				name = IntakeAtm
				unitsPerVolume = 1 
				percentFilled = 0
			}
		}
		SUBTYPE
		{
			name = Water
			title = Water
			primaryColor = Ocean
			secondaryColor = Ocean
			descriptionSummary = #$@STRLB9LOC/txtsysheat$ $@STRLB9LOC/txtsysheatvol$ $/refVolume$ m³ $@STRLB9LOC/txtIntroUnlock$ $@STRLB9LOC/wrapcool_unlock1$
			upgradeRequired = strl-upgrade-coolant1
			// addedMass = #$/addMass1$
			addedCost = #$/addCost1$
			RESOURCE
			{
				name = IntakeAtm
				unitsPerVolume = 0.01
				percentFilled = 0
			}
			RESOURCE
			{
				name = Water
				unitsPerVolume = 5
				percentFilled = 0
			}
			MODULE
			{
				IDENTIFIER
				{
					name = ModuleActiveRadiator
				}
				DATA
				{
					RESOURCE
					{
						name = Water
						rate = #$/refFlow$
					}
				}
			}
		}
	}
}

@PART[strl-worldpower-sth1]:NEEDS[B9PartSwitch,!KerbalismDefault]
{
	MODULE
	{
		name = ModuleB9PartSwitch
		moduleID = Quality
		switcherDescription = Quality
		switcherDescriptionPlural = Qualities
		switchInFlight = True
		SUBTYPE
		{
			name = Low
			title = Low Temperature
			primaryColor = DarkOrange
			secondaryColor = gray
			descriptionSummary = #LOC_strl-worldpower-sth1-lowPower
			descriptionDetail = #$@STRLB9LOC/txtGenMain$$@STRLB9LOC/txtInputs$ 0.6 TP/s. <br>$@STRLB9LOC/txtOutputs$ 300 EC/s.<br> $@STRLB9LOC/txtGenEff$ 50%.  $@STRLB9LOC/txtQuickloadWarn$
		}
		SUBTYPE
		{
			name = High
			title = High Temperature
			primaryColor = Mango
			secondaryColor = gray
			descriptionSummary = #LOC_strl-worldpower-sth1-highPower
			descriptionDetail = #$@STRLB9LOC/txtGenMain$$@STRLB9LOC/txtInputs$ 3.6 TP/s. <br>$@STRLB9LOC/txtOutputs$ 900 EC/s.<br> $@STRLB9LOC/txtGenEff$ 25%.  $@STRLB9LOC/txtQuickloadWarn$
			MODULE
			{
				IDENTIFIER
				{
					name = ModuleResourceConverter
					ConverterName = #LOC_strl_converter_thermoelectric
				}
				DATA
				{
					INPUT_RESOURCE
					{
						ResourceName = ThermalPower
						Ratio = 3.6
						FlowMode = STAGE_PRIORITY_FLOW
					}
					OUTPUT_RESOURCE
					{
						ResourceName = ElectricCharge
						Ratio = 900
						DumpExcess = false
						FlowMode = ALL_VESSEL
					}
				}
			}
		}
	}
}

