@PART[strl-worldpower-tcs?]:NEEDS[SystemHeat]
{
	!MODULE[ModuleDeployableRadiator] {}
	!MODULE[ModuleActiveRadiator] {}
	!MODULE[ModuleAnimateHeat] {}
	refVolume0 = #$refVolume$
	@refVolume0 *= 0.04
	MODULE
	{
		name = ModuleAnimationGroup
		deployAnimationName = unboxing
		activeAnimationName = #$/MODULE[ModuleAnimateActiveSecondary]/animationName$
		deployActionName = Deploy <<1>>
		retractActionName = Retract <<1>>
		toggleActionName = Toggle <<1>>
		moduleType = Convector
	}
	MODULE
	{
		name = ModuleSystemHeat
		volume = #$/refVolume0$
		moduleID = default
		iconName = Icon_Radiator
		ignoreTemperature = true
	}
	MODULE
	{
		name = ModuleSystemHeatColorAnimator
		moduleID = bodyHeat
		useRate = false
		animRate = 1
		shaderProperty = _EmissiveColor
		toggleInEditor = false
		toggleInFlight = false
		redCurve
		{
			key = 0 0
			key = 0.4 1 2.27 0
			key = 1 1
		}
		greenCurve
		{
			key = 0 0
			key = 0.2 0 0 2.18
			key = 0.6 1 2.36 0
			key = 1 1
		}
		blueCurve
		{
			key = 0 0
			key = 0.4 0 0 2.18
			key = 0.8 1 2.41 0
			key = 1 1
		}
		alphaCurve
		{
			key = 0 1
			key = 1 1
		}
	}
	MODULE // Not working. Undocumented
	{
		name = ModuleSystemHeatAnimateHeat
		systemHeatModuleID = default
		scalarModuleID = bodyHeat
		draperPoint = 300
		maxTempAnimation = 1600
	}
	MODULE
	{
		name = ModuleSystemHeatConverter
		ConverterName = ISRU Convector
		StartActionName = Start ISRU Convector
		StopActionName = Stop ISRU Convector
		ToggleActionName = Toggle ISRU Convector
		FillAmount = 1
		AutoShutdown = False
		GeneratesHeat = False
		UseSpecialistBonus = False
		moduleID = ISRUConvector
		systemHeatModuleID = default
		shutdownTemperature = 1600
		systemOutletTemperature = 350
		systemPower = #$/refPower$
		@systemPower *= -1
		systemEfficiency
		{
			key = 308 0
			key = 308.15 1 0 0
		}
		INPUT_RESOURCE
		{
			ResourceName = IntakeAir
			Ratio = #$/refFlow$
		}
	}
	@MODULE[ModuleB9PartSwitch]:HAS[#moduleID[Coolant]]
	{
		@SUBTYPE[Water]
		{
			@MODULE
			{
				@IDENTIFIER
				{
					@name = ModuleSystemHeatConverter
				}
				@DATA
				{
					!RESOURCE {}
					INPUT_RESOURCE
					{
						ResourceName = Water
						Ratio = #$/refFlow$
					}
				}
			}
			MODULE
			{
				IDENTIFIER
				{
					name = ModuleSystemHeat
				}
				DATA
				{
					volume = #$/refVolume$
				}
			}
		}
	}
}