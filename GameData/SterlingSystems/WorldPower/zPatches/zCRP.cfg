@PART[strl-worldpower-wm?]:NEEDS[CommunityResourcePack,!ClassicStock]
{
	@MODULE[ModuleResourceIntake]
	{
		@resourceName = IntakeAtm
	}
	@RESOURCE[IntakeAir]
	{
		@name = IntakeAtm
	}
	@MODULE[ModuleResourceConverter]:HAS[#ConverterName[STRL?Wind]]
	{
		@INPUT_RESOURCE
		{
			@ResourceName = IntakeAtm
		}
	}
}

@PART[strl-worldpower-tcs?]:NEEDS[CommunityResourcePack,!ClassicStock]
{
	@MODULE[ModuleResourceIntake]
	{
		@resourceName = IntakeAtm
	}
	@RESOURCE[IntakeAir]
	{
		name = IntakeAtm
	}
	@MODULE[ModuleActiveRadiator]:NEEDS[!SystemHeat]
	{
		@RESOURCE[IntakeAir]
		{
			@name = IntakeAtm
		}
	}
	@MODULE[ModuleSystemHeatConverter]:NEEDS[SystemHeat]
	{
		@INPUT_RESOURCE
		{
			@ResourceName = IntakeAir
		}
	}
}