@PART[strl-worldpower-batt*]:NEEDS[RealBattery]
{
	SHvol1 = #$refVolume$
	@SHvol1 *= 0.04
	// @mass *= 20
	MODULE
	{
		name = RealBattery
		ChemistryID = Li_poly
		EVAupgrade  = none // target SUBTYPE name; "none" = upgrade prohibited
	}
	MODULE
	{
		name = ModuleSystemHeat
		moduleID = ModuleSystemHeatRealBattery
		volume = #$/SHvol1$
		iconName = Icon_Gears
	}
	// RESOURCE
	// {
		// name = ElectricCharge
		// amount = #$/MODULE[ModuleB9PartSwitch]/baseVolume$
		// @amount *= 2.5
		// maxAmount = #$amount$
		// @maxAmount *= 8
	// }
	@MODULE[ModuleB9PartSwitch]:HAS[#moduleID[fuelSwitch]]
	{
		@baseVolume *= 5
		@SUBTYPE[Li_poly]
        {
			@title = #LOC_RB_title_Li_poly
			%descriptionSummary = #LOC_RB_descSum_Li_poly
			%descriptionDetail = #LOC_RB_descDet_Li_poly
			%tankType = Li_poly
			%defaultSubtypePriority = 10
            MODULE
            {
                IDENTIFIER
                {
                    name = RealBattery
                }
                DATA
                {
                    ChemistryID = Li_poly
                    EVAupgrade  = Graphene // target SUBTYPE name; "none" = upgrade prohibited
                }
            }
        }
        SUBTYPE
        {
            name = Graphene
            title = #LOC_RB_title_Graphene
            descriptionSummary = #LOC_RB_descSum_Graphene
            descriptionDetail = #LOC_RB_descDet_Graphene
            tankType = Graphene
            upgradeRequired = RB_UpgradeGraphene
            defaultSubtypePriority = 11
            MODULE
            {
                IDENTIFIER
                {
                    name = RealBattery
                }
                DATA
                {
                    ChemistryID = Graphene
                    EVAupgrade  = VRFB
                }
            }
			MATERIAL
			{
				name = Basic
				transform = IDBand
				COLOR
				{
					color = #DCB558 // Batt Yellow
				}
			}
        }
		SUBTYPE
        {
            name = RBZebra
            title = #LOC_RB_title_Zebra
            descriptionSummary = #LOC_RB_descSum_Zebra
            descriptionDetail = #LOC_RB_descDet_Zebra
            tankType = RBZebra
            upgradeRequired = RB_UpgradeZebra
            defaultSubtypePriority = 4
            MODULE
            {
                IDENTIFIER
                {
                    name = RealBattery
                }
                DATA
                {
                    ChemistryID = RBZebra
                    EVAupgrade  = MgSb
                }
            }
			MATERIAL
			{
				name = Basic
				transform = IDBand
				COLOR
				{
					color = #BF6D33
				}
			}
        }
        SUBTYPE
        {
            name = MgSb
            title = #LOC_RB_title_MgSb
            descriptionSummary = #LOC_RB_descSum_MgSb
            descriptionDetail = #LOC_RB_descDet_MgSb
            tankType = RB_MgSb
            upgradeRequired = RB_UpgradeMgSb
            defaultSubtypePriority = 5
            MODULE
            {
                IDENTIFIER
                {
                    name = RealBattery
                }
                DATA
                {
                    ChemistryID = MgSb
                    EVAupgrade  = none
                }
            }
			MATERIAL
			{
				name = Basic
				transform = IDBand
				COLOR
				{
					color = #BF6D33
				}
			}
        }
		SUBTYPE
		{
			name = VRFB
			title = #LOC_RB_title_VRFB
			descriptionSummary = #LOC_RB_descSum_VRFB
			descriptionDetail = #LOC_RB_descDet_VRFB
			tankType = RB_VRFB
			upgradeRequired = RB_UpgradeVRFB
			defaultSubtypePriority = 8
			MODULE
			{
				IDENTIFIER
				{
					name = RealBattery
				}
				DATA
				{
					ChemistryID = VRFB
					EVAupgrade  = SMES
				}
			}
			MATERIAL
			{
				name = Basic
				transform = IDBand
				COLOR
				{
					color = #DCB558 // Batt Yellow
				}
			}
		}
		SUBTYPE
		{
			name = SMES
			title = #LOC_RB_title_SMES
			descriptionSummary = #LOC_RB_descSum_SMES
			descriptionDetail = #LOC_RB_descDet_SMES
			tankType = RB_SMES
			upgradeRequired = RB_UpgradeSMES
			defaultSubtypePriority = 1
			MODULE
			{
				IDENTIFIER
				{
					name = RealBattery
				}
				DATA
				{
					ChemistryID = SMES
					EVAupgrade  = none
				}
			}
			MATERIAL
			{
				name = Basic
				transform = IDBand
				COLOR
				{
					color = #DCB558 // Batt Yellow
				}
			}
		}
	}
}