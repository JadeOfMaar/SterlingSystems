@PART[strl-rad-rollw*]:NEEDS[B9PartSwitch]
{
	MODULE
	{
		name = ModuleB9PartSwitch
		moduleID = Service
		switcherDescription = #LOC_strl_subtype_Service
		switcherDescriptionPlural = #LOC_strl_subtype_Services
		SUBTYPE
		{
			name = 01
			title = Cryo
			descriptionSummary = #$@STRLB9LOC/txtsysheat$ $@STRLB9LOC/txtsysheatpwr$ $/refPower$ kW $@STRLB9LOC/txtsysheattemp$ $/refTemp$ K <br>$@STRLB9LOC/txtInputs$ $/refECReq$ EC/s
			primaryColor = gray
			secondaryColor = ResourceColorLqdHydrogen
			defaultSubtypePriority = 1
			maxTemp = 1500
		}
		SUBTYPE
		{
			name = 02
			title = ISRU
			descriptionSummary = #$@STRLB9LOC/txtsysheat$ $@STRLB9LOC/txtsysheatpwr$ $/refPowerB$ kW $@STRLB9LOC/txtsysheattemp$ $/refTempB$ K <br>$@STRLB9LOC/txtInputs$ $/refECReqB$ EC/s
			primaryColor = gray
			secondaryColor = Auburn
			addedMass = #$/refAddedMass$
			addedCost = #$/refAddedCost$
			maxTemp = 1800
			MODULE
			{
				IDENTIFIER
				{
					name = ModuleActiveRadiator
				}
				DATA
				{
					maxEnergyTransfer = #$/refPowerB$
					@maxEnergyTransfer *= 50
					overcoolFactor = 1
					RESOURCE
					{
						name = ElectricCharge
						rate = #$/refECReqB$
					}
				}
			}
		}
	}
}
@PART[strl-rad-roll?-125-?]
{		
	MODULE
	{
		name = ModuleB9PartSwitch
		moduleID = base
		switcherDescription = Shape
		switcherDescriptionPlural = Shapes
		SUBTYPE
		{
			name = 01
			title = Default
			defaultSubtypePriority = 1
		}
		SUBTYPE
		{
			name = 02
			title = WorldPower
			transform = platWP
			node = s01
			node = s02
			node = s03
			node = s04
			node = s05
			node = s06
			TRANSFORM
			{
				name = main
				positionOffset = 0, 0, -0.6
			}
		}
		SUBTYPE
		{
			name = 03
			title = WorldPower + Underground
			transform = platWP
			transform = Underground
			node = s01
			node = s02
			node = s03
			node = s04
			node = s05
			node = s06
			TRANSFORM
			{
				name = main
				positionOffset = 0, 0, -0.6
			}
		}
	}
}
@PART[strl-rad-roll*]:NEEDS[B9PartSwitch,!SystemHeat]
{
	MODULE
	{
		name = ModuleB9PartSwitch
		moduleID = tracking
		switcherDescription = Tracking
		switcherDescriptionPlural = Tracking States
		SUBTYPE
		{
			name = on
			title = On
			defaultSubtypePriority = 1
		}
		SUBTYPE
		{
			name = off
			title = Off
			MODULE
			{
				IDENTIFIER
				{
					name = ModuleDeployableRadiator
				}
				DATA
				{
					isTracking = False
				}
			}
		}
	}
}