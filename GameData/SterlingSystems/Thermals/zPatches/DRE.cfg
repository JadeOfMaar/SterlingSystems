@B9_TANK_TYPE[STRL_AB]:NEEDS[DeadlyReentry]
{
    @RESOURCE[Ablator]
    {
        @name = AblativeShielding
    }
}

@PART[strl-shl-sun01]:AFTER[DeadlyReentry]:NEEDS[B9PartSwitch]
{
    @MODULE[ModuleHeatShield]
    {
        %depletedMaxTemp = #$../skinMaxTemp$
    }

    @MODULE[ModuleB9PartSwitch]:HAS[#moduleID[Service]]
    {
        @SUBTYPE,*
        {
            @MODULE:HAS[@IDENTIFIER[ModuleAblator]]
            {
                @IDENTIFIER
                {
                    @name = ModuleHeatShield
                }
                @DATA
                {
                    // ModuleHeatShield should remain active even when there
                    // is no ablator because it has an effect regardless.
                    !moduleIsActive = delete
                }
            }

            MODULE
            {
                IDENTIFIER
                {
                    name = ModuleAeroReentry
                }
                DATA {}
            }
        }

        @SUBTYPE:HAS[#maxTemp]
        {
            @MODULE:HAS[@IDENTIFIER[ModuleAeroReentry]]
            {
                @DATA
                {
                    maxOperationalTemp = #$../../maxTemp$
                }
            }
        }

        @SUBTYPE:HAS[#skinMaxTemp]
        {
            @MODULE:HAS[@IDENTIFIER[ModuleAeroReentry]]
            {
                @DATA
                {
                    skinMaxOperationalTemp = #$../../skinMaxTemp$
                }
            }

            @MODULE:HAS[@IDENTIFIER[ModuleHeatShield]]
            {
                %DATA
                {
                    %depletedMaxTemp = #$../../skinMaxTemp$
                }
            }
        }

        @SUBTYPE,*
        {
            @MODULE:HAS[@IDENTIFIER[ModuleAeroReentry]]
            {
                @DATA
                {
                    @maxOperationalTemp *= 0.85
                    @skinMaxOperationalTemp *= 0.85
                }
            }
        }
    }
}
