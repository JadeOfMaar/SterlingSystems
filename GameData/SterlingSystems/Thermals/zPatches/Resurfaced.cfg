// = = = Roll-out radiators = = =

SHABBY_MATERIAL_DEF:NEEDS[Resurfaced]
{
	name = strl-rad-rollbod
	shader = Resurfaced/Standard
	TEXTURE
	{
		_MainTex  = SterlingSystems/Thermals/RadiatorsRoll/ScrollBodies_DIFF
		_EmissiveMap = SterlingSystems/Thermals/RadiatorsRoll/ScrollBodies_EMM
		_MetalMap = SterlingSystems/Thermals/RadiatorsRoll/ScrollBodies_MTL
		_BumpMap  = SterlingSystems/Thermals/RadiatorsRoll/ScrollBodies_NRM
	}
	COLOR
	{
		_Color = #fff
	}
	FLOAT
	{
		_Metalness = 1.0
		_Smoothness  = 1.0
		_MetalAlbedoMultiplier = 1.5
	}
}
SHABBY_MATERIAL_DEF:NEEDS[Resurfaced]
{
	name = strl-rad-rollpnl
	shader = Resurfaced/Standard
	TEXTURE
	{
		_MainTex  = SterlingSystems/Thermals/RadiatorsRoll/ScrollPanelsA1_DIFF
		_EmissiveMap = SterlingSystems/Thermals/RadiatorsRoll/ScrollPanelsA1_EMM
		_MetalMap = SterlingSystems/Thermals/RadiatorsRoll/ScrollPanelsA1_MTL
		_BumpMap  = SterlingSystems/Thermals/RadiatorsRoll/ScrollPanelsA1_NRM
	}
	COLOR
	{
		_Color = #fff
	}
	FLOAT
	{
		_Metalness = 1.0
		_Smoothness  = 1.0
		_MetalAlbedoMultiplier = 1.5
	}
}
@PART[strl-rad-roll*]:NEEDS[Resurfaced]
{
	SHABBY_MATERIAL_REPLACE
	{
		materialDef = strl-rad-rollbod
		targetMaterial = BodyMatte
	}
	SHABBY_MATERIAL_REPLACE
	{
		materialDef = strl-rad-rollpnl
		targetMaterial = SheetMatte
	}
}

