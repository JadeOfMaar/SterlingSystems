// = = = Heatsinks = = = 

@PART[strl-rad-sink-*]:NEEDS[SystemHeat]
{
	refVolume0 = #$refVolume$
	refVolume2 = #$refVolume$
	@refVolume0 *= 0.04
	@refVolume2 *= 2.535
	MODULE
	{
		name = ModuleSystemHeat
		volume = #$/refVolume$
		@volume *= 0.04 // 6.12
		moduleID = sink
		iconName = Icon_Tank
		ignoreTemperature = true
	}
	!MODULE[ModuleAnimateHeat] {}
	MODULE
	{
		name = ModuleSystemHeatColorAnimator
		moduleID = bodyHeat
		animRate = 1
		shaderProperty = _EmissiveColor
		toggleInEditor = false
		toggleInFlight = false
		includedTransformList = body
		redCurve
		{
			key = 0 0
			key = 0.4 1 2.27 0
			key = 1 1
		}
		greenCurve
		{
			key = 0 0
			key = 0.2 0 0 2.18
			key = 0.6 1 2.36 0
			key = 1 1
		}
		blueCurve
		{
			key = 0 0
			key = 0.4 0 0 2.18
			key = 0.8 1 2.41 0
			key = 1 1
		}
		alphaCurve
		{
			key = 0 1
			key = 1 1
		}
	}
	MODULE
	{
		name = ModuleSystemHeatColorAnimator
		moduleID = gauge
		animRate = 1
		shaderProperty = _EmissiveColor
		toggleInEditor = false
		toggleInFlight = false
		includedTransformList = gauge
		redCurve
		{
			key = 0 0
			key = 0.4 1 2.27 0
			key = 1 1
		}
		greenCurve
		{
			key = 0 0
			key = 0.2 0 0 2.18
			key = 0.6 1 2.36 0
			key = 1 1
		}
		blueCurve
		{
			key = 0 0
			key = 0.4 0 0 2.18
			key = 0.8 1 2.41 0
			key = 1 1
		}
		alphaCurve
		{
			key = 0 1
			key = 1 1
		}
	}
	MODULE
	{
		name = ModuleSystemHeatResourceAnimator
		ResourceName = ThermalPower
		ScalarModuleID = gauge
	}
	@MODULE[ModuleActiveRadiator]
	{
		@name = ModuleSystemHeatRadiator
		moduleID = radiator
		// ModuleSystemHeat instance to link to
		systemHeatModuleID = default
		scalarModuleID = bodyHeat
		maxTempAnimation = 1800

		// option: use deterministic temperatures
		// Power radiated per temperature
		temperatureCurve
		{
			key = 0 0
			key = 0.2 0.0016
			key = 0.4 0.0256
			key = 0.6 0.1296
			key = 0.8 0.4096
			key = 1 1
			@key,*[0, ] *= #$/refTemp$
			@key,*[1, ] *= #$/refPower$
		}
		// area for convection
		convectiveArea = #$/refArea$
	}
	
	MODULE
	{
		name = ModuleB9PartSwitch
		moduleID = Selection
		switcherDescription = Selection
		switcherDescriptionPlural = Selections
		baseVolume = #$/refVolume$
		SUBTYPE
		{
			name = 01
			title = Dry
			primaryColor = gray
			secondaryColor = gray
			descriptionSummary = #$@STRLB9LOC/txtsysheat$ $@STRLB9LOC/txtsysheatvol$ $/refVolume0$ m³
			RESOURCE
			{
				name = ThermalPower
				unitsPerVolume = 0.2
				percentFilled = 0
			}
		}
		SUBTYPE
		{
			name = 02
			title = Water
			primaryColor = Ocean
			secondaryColor = Ocean
			descriptionSummary = #$@STRLB9LOC/txtsysheat$ $@STRLB9LOC/txtsysheatvol$ $/refVolume$ m³ $@STRLB9LOC/txtIntroUnlock$ $@STRLB9LOC/wrapcool_unlock1$
			addedMass = #$/addMass1$
			addedCost = #$/addCost1$
			upgradeRequired = strl-upgrade-coolant1
			// volumeAdded = #$/refVolume$
			// @volumeAdded *= 4
			MODULE
			{
				IDENTIFIER
				{
					name = ModuleSystemHeat
				}
				DATA
				{
					volume = #$/refVolume$
				}
			}
			RESOURCE
			{
				name = ThermalPower
				unitsPerVolume = 5
				percentFilled = 25
			}
		}
		SUBTYPE
		{
			name = 03
			title = Molten Salt
			primaryColor = Orange
			secondaryColor = OffWhite
			descriptionSummary = #$@STRLB9LOC/txtsysheat$ $@STRLB9LOC/txtsysheatvol$ $/refVolume2$ m³ $@STRLB9LOC/txtIntroUnlock$ $@STRLB9LOC/wrapcool_unlock2$
			addedMass = #$/addMass2$
			addedCost = #$/addCost2$
			upgradeRequired = strl-upgrade-coolant2
			MODULE
			{
				IDENTIFIER
				{
					name = ModuleSystemHeat
				}
				DATA
				{
					volume = #$/refVolume2$
				}
			}
			RESOURCE
			{
				name = ThermalPower
				unitsPerVolume = 12.5
				percentFilled = 25
			}
		}
	}
}


