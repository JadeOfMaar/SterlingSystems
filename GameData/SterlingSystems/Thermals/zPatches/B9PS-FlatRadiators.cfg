@PART[strl-rad-flatb-tri??]:NEEDS[B9PartSwitch]
{
	SHvol02 = #$SHvol01$
	SHvol03 = #$SHvol01$
	@SHvol02 *= 2
	@SHvol03 *= 3
	
	refPower01MW = #$refPower01$
	refPower02MW = #$refPower02$
	refPower03MW = #$refPower03$
	@refPower01MW /= 1000
	@refPower02MW /= 1000
	@refPower03MW /= 1000
	
	MODULE
	{
		name = ModuleB9PartSwitch
		moduleID = Span
		switcherDescription = #LOC_strl_subtype_Span
		switcherDescriptionPlural = #LOC_strl_subtype_Spans
		SUBTYPE
		{
			name = 01
			title = 9.46232 deg
			descriptionSummary = #$@STRLB9LOC/txtsysheat$ $@STRLB9LOC/txtsysheatpwr$ $/refPower01MW$ MW $@STRLB9LOC/txtsysheattemp$ $/refTemp$ K $@STRLB9LOC/txtsysheatvol$ $/SHvol01$ m³
			transform = 01
		}
		SUBTYPE
		{
			name = 02
			title = 18.43494 deg
			descriptionSummary = #$@STRLB9LOC/txtsysheat$ $@STRLB9LOC/txtsysheatpwr$ $/refPower02MW$ MW $@STRLB9LOC/txtsysheattemp$ $/refTemp$ K $@STRLB9LOC/txtsysheatvol$ $/SHvol02$ m³
			transform = 02
			addedCost = #$/cost$
			@addedCost *= 1
			addedMass = #$/mass$
			@addedMass *= 1
			CoMOffset = -1.25, 1.3, 0
			CoLOffset = -1.25, 1.3, 0
			CoPOffset = -1.25, 1.3, 0
			MODULE
			{
				IDENTIFIER
				{
					name = ModuleActiveRadiator
				}
				DATA
				{
					maxEnergyTransfer = #$/refPower02$
					@maxEnergyTransfer *= 50
					RESOURCE
					{
						name = ElectricCharge
						rate = #$/refECReq02$
					}
				}
			}
		}
		SUBTYPE
		{
			name = 03
			title = 26.565 deg
			descriptionSummary = #$@STRLB9LOC/txtsysheat$ $@STRLB9LOC/txtsysheatpwr$ $/refPower03MW$ MW $@STRLB9LOC/txtsysheattemp$ $/refTemp$ K $@STRLB9LOC/txtsysheatvol$ $/SHvol03$ m³
			transform = 03
			addedCost = #$/cost$
			@addedCost *= 2
			addedMass = #$/mass$
			@addedMass *= 2
			CoMOffset = -1.875, 1.3, 0
			CoLOffset = -1.875, 1.3, 0
			CoPOffset = -1.875, 1.3, 0
			MODULE
			{
				IDENTIFIER
				{
					name = ModuleActiveRadiator
				}
				DATA
				{
					maxEnergyTransfer = #$/refPower03$
					@maxEnergyTransfer *= 50
					RESOURCE
					{
						name = ElectricCharge
						rate = #$/refECReq03$
					}
				}
			}
		}
	}
}

