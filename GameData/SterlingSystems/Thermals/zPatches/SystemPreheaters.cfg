		@systemPower *= 1000
		systemEfficiency
		{
			key = 0 0
			key = 1 1 0 0
		}
		StartActionName = Start Heating
		StopActionName = Stop Heating
		ToggleActionName = Toggle Heating
		ConverterName = Heating
