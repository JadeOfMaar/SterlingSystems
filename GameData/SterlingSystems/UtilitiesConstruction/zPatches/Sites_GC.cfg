// Global Construction (GroundConstruction) assembly-space patch for the Sterling
// These pads provide the assembly SPACE only; pair them with a part carrying an
// assembly workshop module (GroundAssemblyWorkshop, SingleVesselAssemblyWorkshop) to
// actually create kits. SpawnOffset is now tested and verified

@PART[strl-site-rect-field01]:NEEDS[GroundConstruction,!Launchpad]
{
	!MODULE[ModuleB9DisableTransform] {}
	MODULE
	{
		name = AssemblySpace
		Title = Assembly Field
		SpawnManager
		{
			SpawnSpace = assemblyZone
			SpawnTransform = launchPos
			SpawnOffset = 0, 1.02, 0
		}
	}
}
