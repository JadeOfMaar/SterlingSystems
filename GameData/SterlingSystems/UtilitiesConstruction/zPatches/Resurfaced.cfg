// = = = Printeries = = =

SHABBY_MATERIAL_DEF:NEEDS[Resurfaced]
{
	name = strl-cylAssembly
	shader = Resurfaced/Standard
	TEXTURE
	{
		_MainTex  = SterlingSystems/UtilitiesConstruction/PrintersCirc/CylAssembly_DIFF
		_EmissiveMap = SterlingSystems/UtilitiesConstruction/PrintersCirc/CylAssembly_EMM
		_MetalMap = SterlingSystems/UtilitiesConstruction/PrintersCirc/CylAssembly_MTL
		_BumpMap  = SterlingSystems/UtilitiesConstruction/PrintersCirc/CylAssembly_NRM
	}
	COLOR
	{
		_Color = #fff
	}
	FLOAT
	{
		_Metalness = 1.0
		_Smoothness  = 1.0
		_MetalAlbedoMultiplier = 1.5
	}
}

@PART[strl-isru-circ-prt-???]:NEEDS[Resurfaced]
{
	SHABBY_MATERIAL_REPLACE
	{
		materialDef = strl-cylAssembly
		targetMaterial = HullMatte
	}
}


